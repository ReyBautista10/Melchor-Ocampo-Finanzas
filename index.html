<script>
const SUPABASE_URL="https://bklzxolimbxyatlloanp.supabase.co";const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrbHp4b2xpbWJ4eWF0bGxvYW5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTg4MzksImV4cCI6MjEwNDc5NDgzOX0.qDb5llaNmbJINUt48bySfci8XBO4F3N-AqlGjKjq4V0";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null,trasladoTemp=null,cacheUsuarios=[],ultimoReporte=[];
function passValida(p){return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(p);}
async function login(){
 const l=document.getElementById('lLogin').value.trim();
 const pa=document.getElementById('lPass').value.trim();
 document.getElementById('lMsg').textContent='Buscando...';
 document.getElementById('lDebug').textContent='';
 try{
  const {data,error}=await sb.from('usuarios').select('*').eq('login',l).maybeSingle();
  if(error){document.getElementById('lMsg').textContent='Error Supabase';document.getElementById('lDebug').textContent=error.message+' | Ejecuta ALTER TABLE usuarios DISABLE ROW LEVEL SECURITY;';return;}
  if(!data){document.getElementById('lMsg').textContent='Usuario no encontrado: '+l;document.getElementById('lDebug').textContent='Revisa que login sea exacto. Existe ReyBautista10, Erasmo10, Cili1207';return;}
  if(!data.activo){document.getElementById('lMsg').textContent='Usuario dado de baja';return;}
  const passBD=(data.password||'').trim();
  if(passBD!==pa){document.getElementById('lMsg').textContent='Contraseña incorrecta';document.getElementById('lDebug').textContent=`Ingresaste: [${pa}] BD tiene: [${passBD}] Long BD:${passBD.length} tuya:${pa.length}`;return;}
  user=data;localStorage.setItem('ses',JSON.stringify(user));iniciar();
 }catch(e){document.getElementById('lDebug').textContent='JS error: '+e.message;}
}
function logout(){localStorage.removeItem('ses');location.reload();}
function buildMenu(){const m=document.getElementById('menu');let h='';if(['super_admin','director'].includes(user.rol))h+=`<button onclick="showTab('usuario')" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm">Usuario</button>`;if(['presidente','tesorero'].includes(user.rol))h+=`<button onclick="showTab('balance')" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-sm">Balance</button>`;h+=`<button onclick="showTab('reportes')" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm">Reportes</button>`;if(['super_admin','director'].includes(user.rol))h+=`<button onclick="showTab('auditoria')" class="bg-purple-600 text-white px-4 py-2 rounded-xl text-sm">Auditoría</button>`;h+=`<button onclick="logout()" class="bg-slate-200 px-3 py-2 rounded-xl text-sm">Salir</button>`;m.innerHTML=h;}
function showTab(t){['usuario','balance','reportes','auditoria'].forEach(x=>{let el=document.getElementById('tab'+x.charAt(0).toUpperCase()+x.slice(1));if(el)el.classList.add('hidden');});document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.remove('hidden');if(t==='usuario')cargarAdmin();if(t==='balance')cargarMisCuentas();if(t==='reportes')generarReporte('dia');if(t==='auditoria')cargarAuditorias();}
function toggleSaldos(){const com=document.getElementById('fComite').value;const rol=document.getElementById('fRol').value;document.getElementById('acreBox').classList.toggle('hidden',!(com==='Padres de Familia' && rol==='tesorero'));}
async function iniciar(){if(!user){const s=localStorage.getItem('ses');if(s)user=JSON.parse(s);}if(!user)return;document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('uNombre').textContent=user.nombre_completo;document.getElementById('uDetalle').textContent=`${user.login} | ${user.rol} | ${user.comite}`;buildMenu();if(['super_admin','director'].includes(user.rol))showTab('usuario');else showTab('balance');}
function validarUnico(){const rol=document.getElementById('fRol').value,com=document.getElementById('fComite').value,btn=document.getElementById('btnAlta'),msg=document.getElementById('adminMsg');if(!rol||!com)return;const existe=cacheUsuarios.find(u=>u.rol===rol && u.comite===com && u.activo);if(existe){msg.textContent=`❌ Ya existe ${rol} en ${com}: ${existe.nombre_completo}`;btn.disabled=true;btn.classList.add('opacity-50');}else{msg.textContent=`✅ Disponible ${rol} en ${com}`;btn.disabled=false;btn.classList.remove('opacity-50');}}
async function cargarAdmin(){const {data}=await sb.from('usuarios').select('*').neq('id',1).order('id');cacheUsuarios=data||[];document.getElementById('rolesOcupados').textContent='Ocupados: '+(cacheUsuarios.filter(u=>u.activo).map(u=>`${u.rol}-${u.comite}`).join(', ')||'ninguno');document.getElementById('listaUsuarios').innerHTML=cacheUsuarios.map(u=>`<div class="border rounded-xl p-3 bg-slate-50"><div class="flex justify-between"><div><b>${u.login}</b> ${u.nombre_completo} | ${u.rol} | ${u.comite} | ${u.activo?'Activo':'Baja'}</div><div class="flex gap-1"><button onclick="toggleActivo(${u.id},${u.activo})" class="text-xs bg-yellow-100 px-2 py-1 rounded">${u.activo?'Baja':'Alta'}</button><button onclick="borrarU(${u.id})" class="text-xs bg-red-100 px-2 py-1 rounded">Borrar</button></div></div></div>`).join('');}
async function crearUsuario(){const login=document.getElementById('fLogin').value.trim(),pass=document.getElementById('fPass').value.trim(),nombre=document.getElementById('fNombre').value.trim(),tel=document.getElementById('fTel').value.trim(),rol=document.getElementById('fRol').value,comite=document.getElementById('fComite').value,sCaja=parseFloat(document.getElementById('fSaldoCaja').value)||0,sAcre=parseFloat(document.getElementById('fSaldoAcre').value);if(!login||!pass||!nombre||!tel||!rol||!comite)return alert('Faltan');if(!passValida(pass))return alert('Pass invalida');if(cacheUsuarios.find(u=>u.rol===rol && u.comite===comite && u.activo))return alert('Ya existe rol en ese comité');const mapa={'Padres de Familia':1,'Parcela':2,'Escuela es Nuestra':3};let comite_id=mapa[comite]||1;const maxId=await sb.from('usuarios').select('id').order('id',{ascending:false}).limit(1);let newId=(maxId.data?.[0]?.id||1)+1;const {data:u,error}=await sb.from('usuarios').insert([{id:newId,login,password:pass,nombre_completo:nombre,telefono:tel,rol,comite}]).select().single();if(error){document.getElementById('adminMsg').textContent=error.message;return;}await sb.from('cuentas').insert([{usuario_id:u.id,comite_id,tipo:'caja_chica',nombre:`Caja Chica ${comite} - ${nombre}`,saldo_inicial:sCaja}]);if(comite==='Padres de Familia'&&rol==='tesorero'&&!isNaN(sAcre)&&sAcre>0){await sb.from('cuentas').insert([{usuario_id:u.id,comite_id,tipo:'acreimex',nombre:`Acreimex ${comite} - ${nombre}`,saldo_inicial:sAcre}]);}cargarAdmin();}
async function toggleActivo(id,act){await sb.from('usuarios').update({activo:!act}).eq('id',id);cargarAdmin();}
async function borrarU(id){if(!confirm('Borrar?'))return;await sb.from('usuarios').delete().eq('id',id);cargarAdmin();}
async function cargarMisCuentas(){const {data:cuentas}=await sb.from('cuentas').select('*, usuarios!inner(nombre_completo,rol), comites(nombre)').eq('usuario_id',user.id).order('id');const cont=document.getElementById('misCuentas');cont.innerHTML='';const tO=document.getElementById('tOrigen'),tD=document.getElementById('tDestino');tO.innerHTML='';tD.innerHTML='';for(let c of cuentas||[]){const {data:movs}=await sb.from('movimientos').select('*').eq('cuenta_id',c.id).order('fecha',{ascending:false});let ing=Number(c.saldo_inicial)||0,egr=0;movs.forEach(m=>{if(m.tipo==='entrada'||m.tipo==='traslado_recibido')ing+=Number(m.monto);else egr+=Number(m.monto);});const saldo=ing-egr;cont.innerHTML+=`<div class="card"><div class="flex justify-between"><div><h3 class="font-bold text-sm">${c.nombre}</h3><p class="text-[11px]">${c.comites?.nombre} | Inicial $${c.saldo_inicial}</p></div><span class="font-bold">$${saldo.toFixed(2)}</span></div><div class="mt-3 bg-slate-50 border rounded-xl p-3"><input id="con_${c.id}" placeholder="Concepto" class="w-full border rounded p-2 mt-2 text-sm"><input id="mon_${c.id}" type="number" placeholder="Monto" class="w-full border rounded p-2 mt-2 text-sm"><select id="tip_${c.id}" class="w-full border rounded p-2 mt-2 text-sm"><option value="entrada">Entrada</option><option value="salida">Salida</option></select><input id="fec_${c.id}" type="date" class="w-full border rounded p-2 mt-2 text-sm"><input id="fil_${c.id}" type="file" accept="image/*" class="w-full text-xs mt-2"><button onclick="guardarMov(${c.id})" class="w-full mt-2 bg-slate-900 text-white rounded py-2 text-sm">Guardar</button></div></div>`;tO.innerHTML+=`<option value="${c.id}">${c.nombre} $${saldo.toFixed(2)}</option>`;tD.innerHTML+=`<option value="${c.id}">${c.nombre} - ${c.usuarios.nombre_completo}</option>`;setTimeout(()=>{document.getElementById(`fec_${c.id}`).valueAsDate=new Date();},50);}}
async function guardarMov(cid){const concepto=document.getElementById(`con_${cid}`).value.trim(),monto=parseFloat(document.getElementById(`mon_${cid}`).value),tipo=document.getElementById(`tip_${cid}`).value,fecha=document.getElementById(`fec_${cid}`).value,file=document.getElementById(`fil_${cid}`).files[0];if(!concepto||!monto)return alert('Falta');if(tipo==='salida'&&!file)return alert('Exige comprobante');let url=null;if(file){const name=Date.now()+'_'+file.name;await sb.storage.from('comprobantes').upload(name,file);const {data}=sb.storage.from('comprobantes').getPublicUrl(name);url=data.publicUrl;}await sb.from('movimientos').insert([{cuenta_id:cid,usuario_id:user.id,tipo,concepto,monto,fecha,comprobante_url:url,created_by:user.id}]);cargarMisCuentas();}
async function iniciarTraslado(){const origen=parseInt(document.getElementById('tOrigen').value),destino=parseInt(document.getElementById('tDestino').value),monto=parseFloat(document.getElementById('tMonto').value);if(!monto||origen===destino)return alert('Datos');const {data:cuOr}=await sb.from('cuentas').select('*, usuarios!inner(*), comites(*)').eq('id',origen).single();const {data:cuDe}=await sb.from('cuentas').select('*, usuarios!inner(*), comites(*)').eq('id',destino).single();let tipoTransfer='';if(cuOr.tipo==='acreimex')tipoTransfer='acreimex_a_caja';else if(cuOr.comite_id!==cuDe.comite_id)tipoTransfer='caja_a_caja_otro_comite';else tipoTransfer='caja_a_presidente_mismo';let html='',info='';if(tipoTransfer==='acreimex_a_caja'){info='Acreimex→Caja: Pres Padres+Director';html=`<label class="text-xs font-bold">Pass Presidente Padres</label><input id="authPresPadres" type="password" class="w-full border rounded p-2 text-sm mb-2"><label class="text-xs font-bold">Pass Director</label><input id="authDir" type="password" class="w-full border rounded p-2 text-sm">`;}else if(tipoTransfer==='caja_a_caja_otro_comite'){info='Caja→Otro: recibe+pres origen+director';html=`<label class="text-xs font-bold">Pass RECIBE</label><input id="authRec" type="password" class="w-full border rounded p-2 text-sm mb-2"><label class="text-xs font-bold">Pass Pres origen</label><input id="authPresOrigen" type="password" class="w-full border rounded p-2 text-sm mb-2"><label class="text-xs font-bold">Pass Director</label><input id="authDir" type="password" class="w-full border rounded p-2 text-sm">`;}else{info='Caja→Presidente: receptor+director';html=`<label class="text-xs font-bold">Pass Presidente receptor</label><input id="authRec" type="password" class="w-full border rounded p-2 text-sm mb-2"><label class="text-xs font-bold">Pass Director</label><input id="authDir" type="password" class="w-full border rounded p-2 text-sm">`;}document.getElementById('authInfo').textContent=info;document.getElementById('authCampos').innerHTML=html;document.getElementById('authBox').classList.remove('hidden');trasladoTemp={origen,destino,monto,cuOr,cuDe,tipoTransfer};}
async function confirmarTraslado(){const pd=document.getElementById('authDir')?.value;const {data:dirs}=await sb.from('usuarios').select('*').in('rol',['director','super_admin']).eq('activo',true);if(!dirs.some(d=>d.password.trim()===pd.trim()))return alert('Pass Director mal');if(trasladoTemp.tipoTransfer==='acreimex_a_caja'){const pp=document.getElementById('authPresPadres').value;const {data:pres}=await sb.from('usuarios').select('*').eq('comite','Padres de Familia').eq('rol','presidente').eq('activo',true);if(!pres.some(p=>p.password.trim()===pp.trim()))return alert('Pass Presidente Padres mal');}else if(trasladoTemp.tipoTransfer==='caja_a_caja_otro_comite'){const pr=document.getElementById('authRec').value,po=document.getElementById('authPresOrigen').value;const {data:uRec}=await sb.from('usuarios').select('*').eq('id',trasladoTemp.cuDe.usuario_id).single();if(uRec.password.trim()!==pr.trim())return alert('Pass receptor mal');const {data:presOr}=await sb.from('usuarios').select('*').eq('comite',trasladoTemp.cuOr.comites.nombre).eq('rol','presidente').eq('activo',true);if(!presOr.some(p=>p.password.trim()===po.trim()))return alert('Pass Pres origen mal');}else{const pr=document.getElementById('authRec').value;const {data:uRec}=await sb.from('usuarios').select('*').eq('id',trasladoTemp.cuDe.usuario_id).single();if(uRec.password.trim()!==pr.trim())return alert('Pass receptor mal');}const f=new Date().toISOString().split('T')[0];await sb.from('movimientos').insert([{cuenta_id:trasladoTemp.origen,usuario_id:user.id,tipo:'traslado_enviado',concepto:`Traslado a ${trasladoTemp.cuDe.usuarios.nombre_completo}`,monto:trasladoTemp.monto,fecha:f,created_by:user.id}]);await sb.
