<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Comités Escolares</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
  <div id="app"></div>

  <script>
    const SUPABASE_URL = "https://bklzxolimbxyatlloanp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrbHp4b2xpbWJ4eWF0bGxvYW5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTg4MzksImV4cCI6MjEwNDc5NDgzOX0.qDb5llaNmbJINUt48bySfci8XBO4F3N-AqlGjKjq4V0";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const COLOR = "#1C3D5A";

    const state = {
      usuario: null,
    };

    const app = document.getElementById("app");

    function errBox(t) { return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#F5E4E1; color:#B5453A">${t}</div>`; }
    function okBox(t) { return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#E6F0EA; color:#3F7A5E">${t}</div>`; }

    function init() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      if (token) { renderEstablecerPassword(token); return; }

      const guardado = sessionStorage.getItem("comite_usuario");
      if (guardado) {
        state.usuario = JSON.parse(guardado);
        renderApp();
      } else {
        renderLogin();
      }
    }

    function renderLogin(mensajeExtra) {
      app.innerHTML = `
        <div class="min-h-screen flex items-center justify-center p-5">
          <div class="w-full max-w-sm p-6 rounded-2xl bg-white border" style="border-color:#E1DED5">
            <div class="text-center mb-6">
              <div class="text-xl font-semibold" style="color:${COLOR}">Sistema de Comités Escolares</div>
              <div class="text-xs mt-1" style="color:#6C7B8A">Control financiero de comités</div>
            </div>
            ${mensajeExtra || ""}
            <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Usuario</label>
            <input id="loginUsuario" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
            <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Contraseña</label>
            <input id="loginPassword" type="password" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
            <button id="olvideBtn" type="button" class="text-xs mb-3 underline" style="color:${COLOR}">¿Olvidaste tu contraseña?</button>
            <div id="loginMsg"></div>
            <button id="loginBtn" class="w-full py-2.5 rounded-lg text-sm font-bold text-white" style="background:${COLOR}">Entrar</button>
          </div>
        </div>`;

      document.getElementById("loginPassword").addEventListener("keydown", e => { if (e.key === "Enter") iniciarSesion(); });
      document.getElementById("loginBtn").addEventListener("click", iniciarSesion);
      document.getElementById("olvideBtn").addEventListener("click", renderOlvidePassword);
    }

    async function iniciarSesion() {
      const usuario = document.getElementById("loginUsuario").value.trim();
      const password = document.getElementById("loginPassword").value;
      const msg = document.getElementById("loginMsg");
      msg.innerHTML = "";
      if (!usuario || !password) { msg.innerHTML = errBox("Escribe tu usuario y contraseña."); return; }

      const { data, error } = await sb.rpc("login_comite", { p_usuario: usuario, p_password: password });
      if (error || !data || !data[0]) { msg.innerHTML = errBox("Usuario o contraseña incorrectos."); return; }

      state.usuario = data[0];
      sessionStorage.setItem("comite_usuario", JSON.stringify(state.usuario));
      renderApp();
    }

    function cerrarSesion() {
      sessionStorage.removeItem("comite_usuario");
      state.usuario = null;
      renderLogin();
    }

    function renderOlvidePassword() {
      app.innerHTML = `
        <div class="min-h-screen flex items-center justify-center p-5">
          <div class="w-full max-w-sm p-6 rounded-2xl bg-white border" style="border-color:#E1DED5">
            <div class="text-center mb-6">
              <div class="text-lg font-semibold" style="color:${COLOR}">Recuperar contraseña</div>
              <div class="text-xs mt-1" style="color:#6C7B8A">Se avisará a tu Director para que te comparta un link nuevo por WhatsApp.</div>
            </div>
            <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Tu usuario</label>
            <input id="olvideUsuario" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
            <div id="olvideMsg"></div>
            <button id="olvideEnviarBtn" class="w-full py-2.5 rounded-lg text-sm font-bold text-white mb-2" style="background:${COLOR}">Solicitar recuperación</button>
            <button id="olvideVolverBtn" type="button" class="w-full py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:${COLOR}">Volver</button>
          </div>
        </div>`;

      document.getElementById("olvideVolverBtn").addEventListener("click", () => renderLogin());
      document.getElementById("olvideEnviarBtn").addEventListener("click", async () => {
        const usuario = document.getElementById("olvideUsuario").value.trim();
        const msg = document.getElementById("olvideMsg");
        msg.innerHTML = "";
        if (!usuario) { msg.innerHTML = errBox("Escribe tu usuario."); return; }
        const { error } = await sb.rpc("password_solicitar_recuperacion", { p_usuario: usuario });
        if (error) { msg.innerHTML = errBox(error.message); return; }
        msg.innerHTML = okBox("Solicitud enviada. Tu Director verá el link en 'Solicitudes' y te lo compartirá por WhatsApp.");
      });
    }

    function renderEstablecerPassword(token) {
      app.innerHTML = `
        <div class="min-h-screen flex items-center justify-center p-5">
          <div class="w-full max-w-sm p-6 rounded-2xl bg-white border" style="border-color:#E1DED5">
            <div class="text-center mb-6">
              <div class="text-lg font-semibold" style="color:${COLOR}">Crear tu contraseña</div>
              <div class="text-xs mt-1" style="color:#6C7B8A">Mínimo 8 caracteres, con mayúscula, minúscula, número y carácter especial.</div>
            </div>
            <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nueva contraseña</label>
            <input id="estNueva" type="password" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5" />
            <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Confirmar contraseña</label>
            <input id="estConfirmar" type="password" class="w-full px-3 py-2 rounded-lg text-sm mb-4 outline-none border" style="border-color:#E1DED5" />
            <div id="estMsg"></div>
            <button id="estGuardarBtn" class="w-full py-2.5 rounded-lg text-sm font-bold text-white" style="background:${COLOR}">Guardar contraseña</button>
          </div>
        </div>`;

      document.getElementById("estGuardarBtn").addEventListener("click", async () => {
        const nueva = document.getElementById("estNueva").value;
        const confirmar = document.getElementById("estConfirmar").value;
        const msg = document.getElementById("estMsg");
        msg.innerHTML = "";
        if (nueva !== confirmar) { msg.innerHTML = errBox("Las contraseñas no coinciden."); return; }

        const { error } = await sb.rpc("password_establecer", { p_token: token, p_password_nueva: nueva });
        if (error) { msg.innerHTML = errBox(error.message); return; }

        msg.innerHTML = okBox("Contraseña creada. Ya puedes entrar.");
        setTimeout(() => { window.location.href = window.location.pathname; }, 1500);
      });
    }

    const MENU = [
      { id: "inicio", label: "Inicio", roles: ["Super Administrador", "Director", "Presidente", "Tesorero"] },
      { id: "usuarios", label: "Usuarios", roles: ["Super Administrador", "Director"] },
      { id: "comites", label: "Comités", roles: ["Super Administrador", "Director"] },
      { id: "solicitudes", label: "Solicitudes de recuperación", roles: ["Super Administrador", "Director"] },
      { id: "logs", label: "Bitácora", roles: ["Super Administrador"] },
    ];

    function renderApp(seccion) {
      const activa = seccion || "inicio";
      const menuVisible = MENU.filter(m => m.roles.includes(state.usuario.rol));

      app.innerHTML = `
        <div class="min-h-screen">
          <div class="px-4 py-3 flex items-center justify-between" style="background:${COLOR}">
            <div>
              <div class="text-base font-semibold text-white">Sistema de Comités Escolares</div>
              <div class="text-xs" style="color:#B9C3CC">${state.usuario.nombre_completo} · ${state.usuario.rol}${state.usuario.comite_nombre ? " · " + state.usuario.comite_nombre : ""}</div>
            </div>
            <button id="logoutBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold" style="background:#B5453A; color:#fff">Cerrar sesión</button>
          </div>
          <div class="flex flex-wrap gap-1 px-4 py-2" style="background:#fff; border-bottom:1px solid #E1DED5">
            ${menuVisible.map(m => `
              <button class="menuBtn px-3 py-1.5 rounded-lg text-sm font-semibold" data-id="${m.id}"
                style="background:${activa === m.id ? COLOR : "transparent"}; color:${activa === m.id ? "#fff" : COLOR}">
                ${m.label}
              </button>`).join("")}
          </div>
          <div id="main" class="p-5"></div>
        </div>`;

      document.getElementById("logoutBtn").addEventListener("click", cerrarSesion);
      document.querySelectorAll(".menuBtn").forEach(b => b.addEventListener("click", () => renderApp(b.dataset.id)));

      const main = document.getElementById("main");
      if (activa === "inicio") return renderInicio(main);
      if (activa === "usuarios") return renderUsuarios(main);
      if (activa === "comites") return renderComites(main);
      if (activa === "solicitudes") return renderSolicitudes(main);
      if (activa === "logs") return renderLogs(main);
    }

    function renderInicio(main) {
      main.innerHTML = `
        <h2 class="text-lg font-bold mb-2" style="color:${COLOR}">Bienvenido/a, ${state.usuario.nombre_completo}</h2>
        <p class="text-sm" style="color:#6C7B8A">Rol: <strong>${state.usuario.rol}</strong>${state.usuario.comite_nombre ? " — " + state.usuario.comite_nombre : ""}</p>
        <div class="mt-4 p-4 rounded-xl bg-white border max-w-md" style="border-color:#E1DED5">
          <p class="text-sm" style="color:#1C2B3A">Este es el arranque del sistema (Fase 1: usuarios, comités y accesos). Los módulos de movimientos, transferencias, auditorías y reportes se irán agregando en las siguientes fases.</p>
        </div>`;
    }

    async function renderUsuarios(main) {
      main.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
      const [{ data: usuarios, error: errU }, { data: comitesData }] = await Promise.all([
        sb.rpc("usuarios_listar", { p_solicitante_id: state.usuario.id }),
        sb.rpc("comites_listar"),
      ]);
      if (errU) { main.innerHTML = errBox(errU.message); return; }
      const comitesLista = comitesData || [];

      function comiteOptionsHtml(comiteIdSeleccionado) {
        return `<option value="">Sin comité</option>` +
          comitesLista.map(c => `<option value="${c.id}" ${c.id === comiteIdSeleccionado ? "selected" : ""}>${c.nombre}</option>`).join("");
      }

      function actualizarCamposPorRol(prefijo) {
  const rol = document.getElementById(`${prefijo}Rol`).value;
  const comiteSel = document.getElementById(`${prefijo}Comite`);
  const saldoCajaInput = document.getElementById(`${prefijo}SaldoCaja`);
  const comiteId = comiteSel.value;
  const comite = comitesLista.find(c => c.id === comiteId);
  const wrapAcreimex = document.getElementById(`${prefijo}AcreimexWrap`);

  const esAdministrativo = (rol === "Director" || rol === "Super Administrador");

  if (esAdministrativo) {
    comiteSel.value = "";
    comiteSel.disabled = true;
    if (saldoCajaInput) {
      saldoCajaInput.value = "0";
      saldoCajaInput.disabled = true;
    }
  } else {
    comiteSel.disabled = false;
    if (saldoCajaInput) {
      saldoCajaInput.disabled = false;
    }
  }

  // Regla estricta: Solo Tesorero de 'Padres de Familia' maneja Acreimex
  const esTesoreroPadres = (rol === "Tesorero") && comite && (comite.nombre === "Padres de Familia");
  
  if (wrapAcreimex) {
    wrapAcreimex.style.display = esTesoreroPadres ? "block" : "none";
  }
}


      main.innerHTML = `
        <h2 class="text-lg font-bold mb-4" style="color:${COLOR}">Usuarios</h2>
        <div class="max-w-2xl">
          <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
            <p class="text-sm font-semibold mb-2" style="color:${COLOR}">Nuevo usuario</p>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <input id="nuUsuario" placeholder="Usuario (login)" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
              <input id="nuNombre" placeholder="Nombre completo" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            </div>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <input id="nuTelefono" placeholder="Teléfono (WhatsApp)" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
              <select id="nuRol" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
                <option value="Presidente">Presidente</option>
                <option value="Tesorero">Tesorero</option>
                ${state.usuario.rol === "Super Administrador" ? `<option value="Director">Director</option>` : ""}
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <select id="nuComite" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
                ${comiteOptionsHtml(null)}
              </select>
              <input id="nuSaldoCaja" type="number" step="0.01" placeholder="Saldo inicial caja chica" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            </div>
            <div id="nuAcreimexWrap" style="display:none" class="mb-2">
              <input id="nuSaldoAcreimex" type="number" step="0.01" placeholder="Saldo inicial cuenta Acreimex" class="w-full px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            </div>
            <div id="nuMsg"></div>
            <button id="nuGuardarBtn" class="px-3 py-1.5 rounded-lg text-sm font-bold text-white" style="background:${COLOR}">Crear usuario</button>
          </div>

          <div class="space-y-2">
            ${(usuarios || []).length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Sin usuarios capturados.</p>` : usuarios.map((u, i) => `
              <div class="p-3 rounded-xl bg-white border" style="border-color:#E1DED5; ${!u.activo ? "opacity:0.5" : ""}">
                <div class="flex items-center justify-between gap-2">
                  <button class="uEditarBtn text-left flex-1" data-idx="${i}">
                    <p class="text-sm font-semibold" style="color:${COLOR}">${u.nombre_completo} <span class="text-xs font-normal" style="color:#6C7B8A">(${u.usuario})</span></p>
                    <p class="text-xs" style="color:#6C7B8A">${u.rol}${u.comite_nombre ? " · " + u.comite_nombre : ""} · Tel: ${u.telefono}${!u.tiene_password ? " · ⏳ Pendiente de activar" : ""}${!u.activo ? " · INACTIVO" : ""}</p>
                  </button>
                </div>
                <div id="uEditWrap${i}"></div>
              </div>`).join("")}
          </div>
          <div id="tokenGeneradoWrap"></div>
        </div>`;

      document.getElementById("nuRol").addEventListener("change", () => actualizarCamposPorRol("nu"));
      document.getElementById("nuComite").addEventListener("change", () => actualizarCamposPorRol("nu"));
      actualizarCamposPorRol("nu");

      document.getElementById("nuGuardarBtn").addEventListener("click", async () => {
        const msg = document.getElementById("nuMsg");
        msg.innerHTML = "";
        const usuario = document.getElementById("nuUsuario").value.trim();
        const nombre = document.getElementById("nuNombre").value.trim();
        const telefono = document.getElementById("nuTelefono").value.trim();
        if (!usuario || !nombre || !telefono) { msg.innerHTML = errBox("Completa usuario, nombre y teléfono."); return; }

        const { data, error } = await sb.rpc("usuario_crear", {
          p_creado_por: state.usuario.id,
          p_usuario: usuario,
          p_nombre_completo: nombre,
          p_telefono: telefono,
          p_rol: document.getElementById("nuRol").value,
          p_comite_id: document.getElementById("nuComite").value || null,
          p_saldo_inicial_caja: Number(document.getElementById("nuSaldoCaja").value) || 0,
          p_saldo_inicial_acreimex: document.getElementById("nuSaldoAcreimex").value ? Number(document.getElementById("nuSaldoAcreimex").value) : null,
        });
        if (error) { msg.innerHTML = errBox(error.message); return; }

        const link = `${window.location.origin}${window.location.pathname}?token=${data[0].token_activacion}`;
        document.getElementById("tokenGeneradoWrap").innerHTML = `
          <div class="p-4 rounded-xl mt-3" style="background:#E6F0EA; border:1px solid #3F7A5E">
            <p class="text-sm font-semibold mb-1" style="color:${COLOR}">Usuario creado. Comparte este link por WhatsApp para que active su cuenta:</p>
            <p class="text-xs break-all" style="color:#1C2B3A">${link}</p>
          </div>`;
        renderUsuarios(main);
      });

      main.querySelectorAll(".uEditarBtn").forEach(b => b.addEventListener("click", () => {
        const u = usuarios[Number(b.dataset.idx)];
        const wrap = document.getElementById(`uEditWrap${b.dataset.idx}`);
        if (wrap.innerHTML) { wrap.innerHTML = ""; return; }

        const prefijo = `ed${b.dataset.idx}`;
        wrap.innerHTML = `
          <div class="mt-3 pt-3" style="border-top:1px solid #E1DED5">
            <div class="grid grid-cols-2 gap-2 mb-2">
              <input id="${prefijo}Nombre" value="${u.nombre_completo}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
              <input id="${prefijo}Telefono" value="${u.telefono}" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            </div>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <select id="${prefijo}Rol" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
                <option value="Presidente" ${u.rol === "Presidente" ? "selected" : ""}>Presidente</option>
                <option value="Tesorero" ${u.rol === "Tesorero" ? "selected" : ""}>Tesorero</option>
                ${state.usuario.rol === "Super Administrador" ? `<option value="Director" ${u.rol === "Director" ? "selected" : ""}>Director</option>` : ""}
              </select>
              <select id="${prefijo}Comite" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
                ${comiteOptionsHtml(u.comite_id)}
              </select>
            </div>
            <div id="${prefijo}AcreimexWrap" style="display:none" class="mb-2">
              <p class="text-xs" style="color:#6C7B8A">Saldo Acreimex registrado: $${u.saldo_acreimex ?? 0}</p>
            </div>
            <div id="${prefijo}Msg"></div>
            <button id="${prefijo}GuardarBtn" class="px-3 py-1.5 rounded-lg text-sm font-bold text-white" style="background:${COLOR}">Guardar cambios</button>
          </div>`;

        document.getElementById(`${prefijo}Rol`).addEventListener("change", () => actualizarCamposPorRol(prefijo));
        document.getElementById(`${prefijo}Comite`).addEventListener("change", () => actualizarCamposPorRol(prefijo));
        actualizarCamposPorRol(prefijo);

        document.getElementById(`${prefijo}GuardarBtn`).addEventListener("click", async () => {
          const msg = document.getElementById(`${prefijo}Msg`);
          msg.innerHTML = "";
          const { error } = await sb.rpc("usuario_modificar", {
            p_solicitante_id: state.usuario.id,
            p_usuario_id: u.id,
            p_nombre_completo: document.getElementById(`${prefijo}Nombre`).value.trim(),
            p_telefono: document.getElementById(`${prefijo}Telefono`).value.trim(),
            p_rol: document.getElementById(`${prefijo}Rol`).value,
            p_comite_id: document.getElementById(`${prefijo}Comite`).value || null,
          });
          if (error) { msg.innerHTML = errBox(error.message); return; }
          renderUsuarios(main);
        });
      }));
    }

    async function renderLogs(main) {
      main.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
      const { data, error } = await sb.rpc("bitacora_listar", { p_solicitante_id: state.usuario.id });
      if (error) { main.innerHTML = errBox(error.message); return; }

      main.innerHTML = `
        <h2 class="text-lg font-bold mb-4" style="color:${COLOR}">Bitácora del sistema</h2>
        <div class="max-w-2xl space-y-2">
          ${(data || []).length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Sin movimientos registrados todavía.</p>` : data.map(l => `
            <div class="p-3 rounded-xl bg-white border" style="border-color:#E1DED5">
              <p class="text-sm font-semibold" style="color:${COLOR}">${l.accion}</p>
              <p class="text-xs" style="color:#1C2B3A">${l.detalle || ""}</p>
              <p class="text-xs mt-1" style="color:#6C7B8A">
                Por: ${l.realizado_por_nombre || "—"}
                ${l.autorizado_por_1_nombre ? " · Autorizó: " + l.autorizado_por_1_nombre : ""}
                ${l.autorizado_por_2_nombre ? " y " + l.autorizado_por_2_nombre : ""}
                · ${new Date(l.fecha_hora).toLocaleString("es-MX")}
              </p>
            </div>`).join("")}
        </div>`;
    }

    async function renderComites(main) {
      main.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
      const { data, error } = await sb.rpc("comites_listar");
      if (error) { main.innerHTML = errBox(error.message); return; }

      main.innerHTML = `
        <h2 class="text-lg font-bold mb-4" style="color:${COLOR}">Comités</h2>
        <div class="max-w-md">
          <div class="space-y-2">
            ${(data || []).length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Sin comités registrados.</p>` : data.map(c => `
              <div class="p-3 rounded-xl bg-white border flex justify-between items-center" style="border-color:#E1DED5">
                <p class="text-sm font-semibold" style="color:${COLOR}">${c.nombre}</p>
                ${c.maneja_acreimex ? `<span class="text-xs px-2 py-0.5 rounded" style="background:#E6F0EA; color:#3F7A5E">Cuenta Acreimex</span>` : ''}
              </div>`).join("")}
          </div>
        </div>`;
    }

    async function renderSolicitudes(main) {
      main.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
      const { data, error } = await sb.rpc("tokens_pendientes_listar", { p_solicitante_id: state.usuario.id });
      if (error) { main.innerHTML = errBox(error.message); return; }

      main.innerHTML = `
        <h2 class="text-lg font-bold mb-4" style="color:${COLOR}">Solicitudes de recuperación / activación</h2>
        <div class="max-w-lg space-y-2">
          ${(data || []).length === 0 ? `<p class="text-sm" style="color:#6C7B8A">No hay solicitudes pendientes.</p>` : data.map((t, i) => `
            <div class="p-3 rounded-xl bg-white border" style="border-color:#E1DED5">
              <p class="text-sm font-semibold" style="color:${COLOR}">${t.nombre_completo} <span class="text-xs font-normal" style="color:#6C7B8A">(${t.usuario})</span></p>
              <p class="text-xs mb-2" style="color:#6C7B8A">${t.tipo} · Tel: ${t.telefono} · Vence: ${new Date(t.expira_en).toLocaleString("es-MX")}</p>
              <div class="flex gap-2">
                <input readonly id="linkTok${i}" value="${window.location.origin}${window.location.pathname}?token=${t.token}" class="flex-1 px-2 py-1 rounded text-xs border" style="border-color:#E1DED5" />
                <button class="copiarBtn px-2 py-1 rounded-lg text-xs font-semibold" data-i="${i}" style="background:#F4F1EB; color:${COLOR}">Copiar</button>
              </div>
            </div>`).join("")}
        </div>`;

      main.querySelectorAll(".copiarBtn").forEach(b => b.addEventListener("click", () => {
        const input = document.getElementById(`linkTok${b.dataset.i}`);
        input.select();
        navigator.clipboard.writeText(input.value);
        b.textContent = "¡Copiado!";
        setTimeout(() => { b.textContent = "Copiar"; }, 1500);
      }));
    }

    init();
  </script>
</body>
</html>
