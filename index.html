// Encabezado institucional de los PDF: logotipo + nombre + clave y ciclo escolar.
// x0 = margen izquierdo; devuelve la posición "y" donde termina el encabezado.
function pdfEncabezado(doc, x0) {
  const W = doc.internal.pageSize.getWidth();
  const alto = 24, ancho = alto * ESCUELA.logoRel;
  try { doc.addImage(ESCUELA.logo, "PNG", x0, 8, ancho, alto); } catch (e) { /* si falla el logo, el PDF sigue */ }
  const xt = x0 + ancho + 4;
  doc.setFont(undefined, "bold"); doc.setFontSize(12);
  doc.text(ESCUELA.nombre.toUpperCase(), xt, 16);
  doc.setFont(undefined, "normal"); doc.setFontSize(9);
  doc.text(`Clave del centro de trabajo: ${ESCUELA.clave}`, xt, 22);
  doc.text(`Ciclo escolar ${ESCUELA.ciclo}`, xt, 27);
  doc.text(ESCUELA.localidad, xt, 32);
  doc.setDrawColor(28, 61, 90); doc.setLineWidth(0.5);
  doc.line(x0, 36, W - x0, 36);
  doc.setLineWidth(0.2); doc.setDrawColor(0);
  return 40;
}

// Encabezado corto para las hojas siguientes
function pdfEncabezadoCorrido(doc, x0) {
  const W = doc.internal.pageSize.getWidth();
  doc.setFont(undefined, "normal"); doc.setFontSize(8);
  doc.text(`${ESCUELA.nombre.toUpperCase()} · Clave ${ESCUELA.clave} · Ciclo escolar ${ESCUELA.ciclo}`, x0, 12);
  doc.setDrawColor(28, 61, 90); doc.line(x0, 14, W - x0, 14); doc.setDrawColor(0);
  return 20;
}

// Bloque de firma: etiqueta arriba, línea y debajo cada dato en su propio renglón.
function pdfFirma(doc, x, ancho, y, etiqueta, lineas) {
  doc.setFontSize(9); doc.setFont(undefined, "normal");
  doc.text(etiqueta, x, y - 10);
  doc.line(x, y, x + ancho, y);
  lineas.forEach((t, i) => doc.text(String(t), x, y + 5 + i * 4.5));
}

  [/object not found|not found/i,
    "No se encontró la información solicitada."],
];
const REGEX_RED = TRADUCCIONES[0][0];
const REGEX_INGLES = /\b(the|is|are|not|cannot|could|failed|invalid|unable|must|already|exists|does|violates|permission|denied|constraint|expected|unexpected|missing|required)\b/i;

function textoDeError(e) {
  if (e == null) return "";
  if (typeof e === "string") return e;
  return String(e.message || e.error_description || e.msg || e);
}
function esErrorDeRed(e) {
  return REGEX_RED.test(textoDeError(e));
}
function traducirMensaje(t) {
  const texto = textoDeError(t);
  for (const [re, es] of TRADUCCIONES) {
    if (re.test(texto)) return es;
  }
  if (REGEX_INGLES.test(texto)) {
    console.warn("Mensaje sin traducir:", texto);
    return "Ocurrió un problema inesperado. Inténtalo de nuevo; si continúa, avisa al administrador del sistema.";
  }
  return texto;
}
const traducirError = traducirMensaje;

function errBox(t) { return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#F5E4E1; color:#B5453A">${traducirMensaje(t)}</div>`; }
function okBox(t) { return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#E6F0EA; color:#3F7A5E">${t}</div>`; }

// ============================================================
// Barra de progreso dinámica (cargas, guardados, modificaciones)
// ============================================================
let _progContador = 0;
let _progAncho = 0;
let _progIntervalo = null;
let _progOcultar = null;

function _progElemento() {
  let el = document.getElementById("progresoGlobal");
  if (!el) {
    el = document.createElement("div");
    el.id = "progresoGlobal";
    el.style.cssText = "position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(28,43,58,0.45)";
    el.innerHTML = `
      <div class="w-full max-w-xs rounded-2xl bg-white p-5" role="status" aria-live="polite">
        <p id="progresoTexto" class="text-sm font-semibold mb-3 text-center" style="color:${COLOR}"></p>
        <div class="w-full h-2.5 rounded-full overflow-hidden" style="background:#E1DED5">
          <div id="progresoBarra" class="h-full rounded-full" style="width:0%; background:${COLOR}; transition:width .25s ease"></div>
        </div>
        <p class="text-xs mt-2 text-center" style="color:#6C7B8A">Por favor espera…</p>
      </div>`;
    document.body.appendChild(el);
  }
  return el;
}

function mostrarProgreso(texto) {
  const el = _progElemento();
  if (_progOcultar) { clearTimeout(_progOcultar); _progOcultar = null; }
  _progContador++;
  document.getElementById("progresoTexto").textContent = texto;
  if (_progContador === 1) {
    _progAncho = 0;
    document.getElementById("progresoBarra").style.width = "0%";
    el.style.display = "flex";
    clearInterval(_progIntervalo);
    _progIntervalo = setInterval(() => {
      _progAncho += (90 - _progAncho) * 0.08;
      const barra = document.getElementById("progresoBarra");
      if (barra) barra.style.width = _progAncho.toFixed(1) + "%";
    }, 120);
  }
}

function actualizarProgreso(texto) {
  const t = document.getElementById("progresoTexto");
  if (t) t.textContent = texto;
}

function ocultarProgreso() {
  _progContador = Math.max(0, _progContador - 1);
  if (_progContador > 0) return;
  clearInterval(_progIntervalo);
  _progIntervalo = null;
  const barra = document.getElementById("progresoBarra");
  if (barra) barra.style.width = "100%";
  _progOcultar = setTimeout(() => {
    const el = document.getElementById("progresoGlobal");
    if (el) el.style.display = "none";
    _progOcultar = null;
  }, 250);
}

// Ejecuta una operación mostrando la barra con su descripción
async function conProgreso(texto, fn) {
  mostrarProgreso(texto);
  await new Promise(r => setTimeout(r, 40)); // deja que la barra se pinte antes de trabajo pesado
  try {
    return await fn();
  } finally {
    ocultarProgreso();
  }
}

// Usuario (login): solo letras y números, sin espacios ni caracteres especiales
function filtrarUsuarioLogin(valor) {
  return valor.replace(/[^A-Za-z0-9]/g, "");
}
// Nombre completo: mayúsculas, sin acentos ni signos de puntuación, espacios sí permitidos
function filtrarNombreCompleto(valor) {
  const sinAcentos = valor.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return sinAcentos.toUpperCase().replace(/[^A-Z ]/g, "");
}
function filtrarNombreComite(valor) {
  const sinAcentos = valor.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return sinAcentos.toUpperCase().replace(/[^A-Z ]/g, "");
}
// Comprime una foto antes de subirla (reduce hasta ~1600px de lado mayor,
// calidad 70%) para que ocupe poco espacio sin perder legibilidad
function comprimirImagen(file, maxLado = 1600, calidad = 0.7) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxLado) {
        height = Math.round(height * (maxLado / width));
        width = maxLado;
      } else if (height >= width && height > maxLado) {
        width = Math.round(width * (maxLado / height));
        height = maxLado;
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => {
        URL.revokeObjectURL(url);
        if (blob) resolve(blob); else reject(new Error("No se pudo comprimir la imagen."));
      }, "image/jpeg", calidad);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("No se pudo leer la imagen.")); };
    img.src = url;
  });
}

// Comprime y sube un comprobante al bucket "comprobantes"; regresa la ruta guardada
async function subirComprobante(archivo) {
  const comprimido = await comprimirImagen(archivo);
  const ruta = `${state.usuario.id}/${crypto.randomUUID()}.jpg`;
  const { error } = await sb.storage.from("comprobantes").upload(ruta, comprimido, { contentType: "image/jpeg" });
  if (error) throw error;
  return ruta;
}

function aplicarFiltroEnVivo(elId, filtro) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.addEventListener("input", () => {
    const cursor = el.selectionStart;
    const antes = el.value.length;
    el.value = filtro(el.value);
    const despues = el.value.length;
    el.setSelectionRange(cursor - (antes - despues), cursor - (antes - despues));
  });
}

async function iniciarSesion() {
  if (iniciandoSesion) return; // evita varios clics / Enter mientras ya está entrando

  const usuario = document.getElementById("loginUsuario").value.trim();
  const password = document.getElementById("loginPassword").value;
  const msg = document.getElementById("loginMsg");
  const btn = document.getElementById("loginBtn");
  msg.innerHTML = "";
  if (!usuario || !password) { msg.innerHTML = errBox("Escribe tu usuario y contraseña."); return; }

  iniciandoSesion = true;
  btn.disabled = true;
  btn.textContent = "Entrando…";
  btn.style.opacity = "0.6";
  btn.style.cursor = "not-allowed";

  let resp;
  try {
    resp = await conProgreso("Iniciando sesión…", () => sb.rpc("login_comite", { p_usuario: usuario, p_password: password }));
  } catch (e) {
    resp = { data: null, error: e };
  }

  iniciandoSesion = false;
  btn.disabled = false;
  btn.textContent = "Entrar";
  btn.style.opacity = "1";
  btn.style.cursor = "pointer";

  const { data, error } = resp;
  if (error && esErrorDeRed(error)) { msg.innerHTML = errBox(error); return; }
  if (error || !data || !data[0]) { msg.innerHTML = errBox("Usuario o contraseña incorrectos."); return; }

  state.usuario = data[0];
  sessionStorage.setItem("comite_usuario", JSON.stringify(state.usuario));
  renderApp(); // siempre abre en INICIO
}

function cerrarSesion() {
  sessionStorage.removeItem("comite_usuario");
  state.usuario = null;
  renderLogin();
}

// Establecer contraseña (activación o recuperación, vía ?token=)
// ============================================================
async function renderEstablecerPassword(token) {
  app.innerHTML = `<div class="min-h-screen"></div>`;

  const { data, error } = await conProgreso("Verificando tu enlace…", () => sb.rpc("token_info_obtener", { p_token: token }));

  if (error && esErrorDeRed(error)) {
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-5">
        <div class="w-full max-w-sm p-6 rounded-2xl bg-white border text-center" style="border-color:#E1DED5">
          ${errBox(error)}
          <button id="reintentarTokenBtn" class="w-full py-2.5 rounded-lg text-sm font-bold text-white" style="background:${COLOR}">Reintentar</button>
        </div>
      </div>`;
    document.getElementById("reintentarTokenBtn").addEventListener("click", () => renderEstablecerPassword(token));
    return;
  }

  if (error || !data || !data[0] || !data[0].valido) {
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-5">
        <div class="w-full max-w-sm p-6 rounded-2xl bg-white border text-center" style="border-color:#E1DED5">
          ${errBox("Este link no es válido o ya expiró. Pide uno nuevo.")}
        </div>
      </div>`;
    return;
  }

  const info = data[0];
  const saludoRol = info.comite_nombre ? `${info.rol} de ${info.comite_nombre}` : info.rol;

  function evaluar(pass, confirmar) {
    return {
      mayuscula: /[A-Z]/.test(pass),
      minuscula: /[a-z]/.test(pass),
      numero: /[0-9]/.test(pass),
      especial: /[^A-Za-z0-9]/.test(pass),
      longitud: pass.length >= 8,
      coinciden: pass.length > 0 && pass === confirmar,
    };
  }

  function itemHtml(id, texto, cumple) {
    return `<li id="${id}" class="text-xs" style="color:${cumple ? "#3F7A5E" : "#6C7B8A"}">${cumple ? "✓" : "○"} ${texto}</li>`;
  }

  function pintarChecklist(estado) {
    document.getElementById("checkMayuscula").outerHTML = itemHtml("checkMayuscula", "Mayúscula", estado.mayuscula);
    document.getElementById("checkMinuscula").outerHTML = itemHtml("checkMinuscula", "Minúscula", estado.minuscula);
    document.getElementById("checkNumero").outerHTML = itemHtml("checkNumero", "Número", estado.numero);
    document.getElementById("checkEspecial").outerHTML = itemHtml("checkEspecial", "Carácter especial (@#$_&-...)", estado.especial);
    document.getElementById("checkLongitud").outerHTML = itemHtml("checkLongitud", "Mínimo 8 caracteres", estado.longitud);
    document.getElementById("checkCoinciden").outerHTML = itemHtml("checkCoinciden", "Las contraseñas coinciden", estado.coinciden);
  }

  app.innerHTML = `
    <div class="min-h-screen flex items-center justify-center p-5">
      <div class="w-full max-w-sm p-6 rounded-2xl bg-white border" style="border-color:#E1DED5">
        <div class="text-center mb-4">
          <div class="text-base" style="color:#6C7B8A">Bienvenido/a</div>
          <div class="text-lg font-bold" style="color:${COLOR}">${info.nombre_completo}</div>
          <div class="text-xs" style="color:#6C7B8A">${saludoRol}</div>
        </div>
        <p class="text-sm font-semibold mb-3 text-center" style="color:${COLOR}">Crea tu contraseña</p>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Nueva contraseña</label>
        ${campoPassword("estNueva", "mb-3", "new-password")}
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Confirmar contraseña</label>
        ${campoPassword("estConfirmar", "mb-3", "new-password")}
        <ul class="mb-4 space-y-1">
          <li id="checkMayuscula"></li>
          <li id="checkMinuscula"></li>
          <li id="checkNumero"></li>
          <li id="checkEspecial"></li>
          <li id="checkLongitud"></li>
          <li id="checkCoinciden"></li>
        </ul>
        <div id="estMsg"></div>
        <button id="estGuardarBtn" class="w-full py-2.5 rounded-lg text-sm font-bold text-white" style="background:${COLOR}">Guardar contraseña</button>
      </div>
    </div>`;

  pintarChecklist(evaluar("", ""));

  function actualizar() {
    pintarChecklist(evaluar(document.getElementById("estNueva").value, document.getElementById("estConfirmar").value));
  }
  document.getElementById("estNueva").addEventListener("input", actualizar);
  document.getElementById("estConfirmar").addEventListener("input", actualizar);

  document.getElementById("estGuardarBtn").addEventListener("click", async () => {
    const nueva = document.getElementById("estNueva").value;
    const confirmar = document.getElementById("estConfirmar").value;
    const msg = document.getElementById("estMsg");
    const btn = document.getElementById("estGuardarBtn");
    msg.innerHTML = "";
    if (nueva !== confirmar) { msg.innerHTML = errBox("Las contraseñas no coinciden."); return; }

    btn.disabled = true; btn.style.opacity = "0.6";
    const { error: errGuardar } = await conProgreso("Guardando tu contraseña…", () => sb.rpc("password_establecer", { p_token: token, p_password_nueva: nueva }));
    if (errGuardar) {
      btn.disabled = false; btn.style.opacity = "1";
      msg.innerHTML = errBox(errGuardar.message);
      return;
    }

    msg.innerHTML = okBox("Contraseña creada. Ya puedes entrar.");
    setTimeout(() => { window.location.href = window.location.pathname; }, 1500);
  });
}

// ---------- Usuarios ----------
async function renderUsuarios(main) {
  main.innerHTML = "";
  const [{ data: usuarios, error: errU }, { data: comitesData }] = await conProgreso("Cargando usuarios…", () => Promise.all([
    sb.rpc("usuarios_listar", { p_solicitante_id: state.usuario.id }),
    sb.rpc("comites_listar"),
  ]));
  if (errU) { main.innerHTML = errBox(errU.message); return; }
  const comitesLista = comitesData || [];

  function comiteOptionsHtml(comiteIdSeleccionado) {
    return `<option value="">Sin comité</option>` +
      comitesLista.map(c => `<option value="${c.id}" ${c.id === comiteIdSeleccionado ? "selected" : ""}>${c.nombre}</option>`).join("");
  }

  function actualizarCamposPorRol(prefijo) {
    const rol = document.getElementById(`${prefijo}Rol`).value;
    const comiteSel = document.getElementById(`${prefijo}Comite`);
    const comiteId = comiteSel.value;
    const comite = comitesLista.find(c => c.id === comiteId);
    const wrapAcreimex = document.getElementById(`${prefijo}AcreimexWrap`);
    const wrapCaja = document.getElementById(`${prefijo}CajaWrap`);

    if (rol === "Director") {
      comiteSel.value = "";
      comiteSel.disabled = true;
    } else {
      comiteSel.disabled = false;
    }

    if (wrapCaja) wrapCaja.style.display = rol === "Director" ? "none" : "block";

    const puedeAcreimex = rol === "Tesorero" && comite && comite.maneja_acreimex;
    wrapAcreimex.style.display = puedeAcreimex ? "block" : "none";
    if (!puedeAcreimex) {
      const elSaldoAcreimex = document.getElementById(`${prefijo}SaldoAcreimex`);
      if (elSaldoAcreimex) elSaldoAcreimex.value = "";
    }
  }

  main.innerHTML = `
    <h2 class="text-lg font-bold mb-4" style="color:${COLOR}">Usuarios</h2>
    <div class="max-w-2xl">
      <div class="p-4 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
        <p class="text-sm font-semibold mb-2" style="color:${COLOR}">Nuevo usuario</p>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <input id="nuUsuario" placeholder="Usuario (login)" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
          <input id="nuNombre" placeholder="Nombre completo" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
        </div>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <input id="nuTelefono" placeholder="Teléfono (WhatsApp)" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
          <select id="nuRol" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
            <option value="Presidente">Presidente</option>
            <option value="Tesorero">Tesorero</option>
            ${state.usuario.rol === "Super Administrador" ? `<option value="Director">Director</option>` : ""}
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <select id="nuComite" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5">
            ${comiteOptionsHtml(null)}
          </select>
          <div id="nuCajaWrap">
            <input id="nuSaldoCaja" type="number" step="0.01" placeholder="Saldo inicial caja chica" class="w-full px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
          </div>
        </div>
        <div id="nuAcreimexWrap" style="display:none" class="mb-2">
          <input id="nuSaldoAcreimex" type="number" step="0.01" placeholder="Saldo inicial cuenta Acreimex" class="w-full px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
        </div>
        <div id="nuMsg"></div>
        <button id="nuGuardarBtn" class="px-3 py-1.5 rounded-lg text-sm font-bold text-white" style="background:${COLOR}">Crear usuario</button>
      </div>

      <div class="space-y-2">
        ${(usuarios || []).length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Sin usuarios capturados.</p>` : usuarios.map((u, i) => `
          <div class="p-3 rounded-xl bg-white border" style="border-color:#E1DED5; ${!u.activo ? "opacity:0.5" : ""}">
            <div class="flex items-center justify-between gap-2">
              <button class="uEditarBtn text-left flex-1" data-idx="${i}">
                <p class="text-sm font-semibold" style="color:${COLOR}">${u.nombre_completo} <span class="text-xs font-normal" style="color:#6C7B8A">(${u.usuario})</span></p>
                <p class="text-xs" style="color:#6C7B8A">${u.rol}${u.comite_nombre ? " · " + u.comite_nombre : ""} · Tel: ${u.telefono}${!u.tiene_password ? " · ⏳ Pendiente de activar" : ""}${!u.activo ? " · INACTIVO" : ""}</p>
              </button>
              <button class="uEstadoBtn px-2 py-1 rounded-lg text-xs font-semibold" data-id="${u.id}" data-activo="${u.activo}" style="background:${u.activo ? "#F5E4E1" : "#E6F0EA"}; color:${u.activo ? "#B5453A" : "#3F7A5E"}">${u.activo ? "Inhabilitar" : "Reactivar"}</button>
              <button class="uEliminarBtn px-2 py-1 rounded-lg text-xs font-semibold" data-id="${u.id}" data-nombre="${u.nombre_completo}" style="background:#F5E4E1; color:#B5453A">Eliminar</button>
            </div>
            <div id="uEditWrap${i}"></div>
          </div>`).join("")}
      </div>
      <div id="tokenGeneradoWrap"></div>
    </div>`;

  document.getElementById("nuRol").addEventListener("change", () => actualizarCamposPorRol("nu"));
  document.getElementById("nuComite").addEventListener("change", () => actualizarCamposPorRol("nu"));
  actualizarCamposPorRol("nu");
  aplicarFiltroEnVivo("nuUsuario", filtrarUsuarioLogin);
  aplicarFiltroEnVivo("nuNombre", filtrarNombreCompleto);

  document.getElementById("nuGuardarBtn").addEventListener("click", async () => {
    const msg = document.getElementById("nuMsg");
    msg.innerHTML = "";
    const usuario = document.getElementById("nuUsuario").value.trim();
    const nombre = document.getElementById("nuNombre").value.trim();
    const telefono = document.getElementById("nuTelefono").value.trim();
    const rol = document.getElementById("nuRol").value;
    const comiteId = document.getElementById("nuComite").value || null;
    const saldoCaja = Number(document.getElementById("nuSaldoCaja").value) || 0;
    const saldoAcreimex = document.getElementById("nuSaldoAcreimex").value ? Number(document.getElementById("nuSaldoAcreimex").value) : null;
    if (!usuario || !nombre || !telefono) { msg.innerHTML = errBox("Completa usuario, nombre y teléfono."); return; }

    function limpiarFormulario() {
      document.getElementById("nuUsuario").value = "";
      document.getElementById("nuNombre").value = "";
      document.getElementById("nuTelefono").value = "";
      document.getElementById("nuSaldoCaja").value = "";
      document.getElementById("nuSaldoAcreimex").value = "";
    }

    function mostrarLinkGenerado(token) {
      const link = `${window.location.origin}${window.location.pathname}?token=${token}`;
      document.getElementById("tokenGeneradoWrap").innerHTML = `
        <div class="p-4 rounded-xl mt-3" style="background:#E6F0EA; border:1px solid #3F7A5E">
          <p class="text-sm font-semibold mb-1" style="color:${COLOR}">Listo. Comparte este link por WhatsApp:</p>
          <p class="text-xs break-all" style="color:#1C2B3A">${link}</p>
        </div>`;
    }

    // Paso 1: ver si ese usuario ya existe en la base de datos (aunque esté
    // inactivo o eliminado)
    const { data: existeData, error: errExiste } = await conProgreso("Verificando si el usuario ya existe…", () => sb.rpc("usuario_verificar_existente", { p_usuario: usuario }));
    if (errExiste) { msg.innerHTML = errBox(errExiste.message); return; }
    const info = existeData && existeData[0];

    if (info && info.existe) {
      if (info.activo && !info.eliminado) {
        msg.innerHTML = errBox("Ya existe un usuario con ese nombre.");
        return;
      }

      const quiereReactivar = confirm(
        `Ya existe un usuario "${usuario}" (inactivo o eliminado), registrado antes como ${info.rol}${info.comite_nombre ? " de " + info.comite_nombre : ""}.\n\n¿Deseas reactivarlo?`
      );
      if (!quiereReactivar) {
        limpiarFormulario();
        return;
      }

      const { data: reactivado, error: errReact } = await conProgreso("Reactivando usuario…", () => sb.rpc("usuario_reactivar_con_datos", {
        p_solicitante_id: state.usuario.id,
        p_usuario_existente_id: info.id,
        p_nombre_completo: nombre,
        p_telefono: telefono,
        p_rol: rol,
        p_comite_id: comiteId,
        p_saldo_inicial_caja: saldoCaja,
        p_saldo_inicial_acreimex: saldoAcreimex,
      }));

      if (errReact) {
        const quiereDiferente = confirm(
          `${traducirError(errReact)}\n\n¿Deseas asignarle un rol y/o comité diferente? Cámbialo arriba en el formulario y presiona "Crear usuario" de nuevo.`
        );
        if (!quiereDiferente) {
          msg.innerHTML = errBox("No es posible activarlo, ya que no se pueden duplicar roles de comité.");
        }
        return;
      }

      mostrarLinkGenerado(reactivado[0].token_activacion);
      renderUsuarios(main);
      return;
    }

    // Paso 2: no existía -> alta normal
    const { data, error } = await conProgreso("Creando usuario…", () => sb.rpc("usuario_crear", {
      p_creado_por: state.usuario.id,
      p_usuario: usuario,
      p_nombre_completo: nombre,
      p_telefono: telefono,
      p_rol: rol,
      p_comite_id: comiteId,
      p_saldo_inicial_caja: saldoCaja,
      p_saldo_inicial_acreimex: saldoAcreimex,
    }));
    if (error) { msg.innerHTML = errBox(error.message); return; }

    mostrarLinkGenerado(data[0].token_activacion);
    renderUsuarios(main);
  });

  main.querySelectorAll(".uEstadoBtn").forEach(b => b.addEventListener("click", async () => {
    const activo = b.dataset.activo === "true";
    const { error } = await conProgreso(activo ? "Inhabilitando usuario…" : "Reactivando usuario…", () => sb.rpc("usuario_cambiar_estado", { p_solicitante_id: state.usuario.id, p_usuario_id: b.dataset.id, p_activo: !activo }));
    if (error) { alert(traducirError(error)); return; }
    renderUsuarios(main);
  }));

  main.querySelectorAll(".uEliminarBtn").forEach(b => b.addEventListener("click", async () => {
    const confirmar = confirm(`¿Eliminar a ${b.dataset.nombre} de la lista? No se borra de la base de datos, solo se oculta (sigue disponible para reportes).`);
    if (!confirmar) return;
    const { error } = await conProgreso("Eliminando usuario…", () => sb.rpc("usuario_eliminar", { p_solicitante_id: state.usuario.id, p_usuario_id: b.dataset.id }));
    if (error) { alert(traducirError(error)); return; }
    renderUsuarios(main);
  }));

  main.querySelectorAll(".uEditarBtn").forEach(b => b.addEventListener("click", () => {
    const u = usuarios[Number(b.dataset.idx)];
    const wrap = document.getElementById(`uEditWrap${b.dataset.idx}`);
    if (wrap.innerHTML) { wrap.innerHTML = ""; return; }

    const prefijo = `ed${b.dataset.idx}`;
    wrap.innerHTML = `
      <div class="mt-3 pt-3" style="border-top:1px solid #E1DED5">
        <p class="text-xs mb-2" style="color:#6C7B8A">${u.rol}${u.comite_nombre ? " · " + u.comite_nombre : ""} — el rol y el comité ya no se pueden cambiar aquí (para no dejar huérfano el manejo del dinero); solo el teléfono.</p>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Teléfono</label>
        <input id="${prefijo}Telefono" value="${u.telefono}" class="w-full px-2 py-1.5 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
        <div id="${prefijo}Msg"></div>
        <button id="${prefijo}GuardarBtn" class="px-3 py-1.5 rounded-lg text-sm font-bold text-white" style="background:${COLOR}">Guardar cambios</button>
      </div>`;

    document.getElementById(`${prefijo}GuardarBtn`).addEventListener("click", async () => {
      const msg = document.getElementById(`${prefijo}Msg`);
      msg.innerHTML = "";
      const { error } = await conProgreso("Guardando cambios del usuario…", () => sb.rpc("usuario_modificar", {
        p_solicitante_id: state.usuario.id,
        p_usuario_id: u.id,
        p_telefono: document.getElementById(`${prefijo}Telefono`).value.trim(),
      }));
      if (error) { msg.innerHTML = errBox(error.message); return; }
      renderUsuarios(main);
    });
  }));
}

const MAX_REGISTROS_BITACORA = 500; // al alcanzar este número, se sugiere respaldo en PDF

async function renderLogs(main) {
  main.innerHTML = "";
  const { data, error } = await conProgreso("Cargando bitácora…", () => sb.rpc("bitacora_listar", { p_solicitante_id: state.usuario.id }));
  if (error) { main.innerHTML = errBox(error.message); return; }

  const registros = data || [];
  const alcanzoMax = registros.length >= MAX_REGISTROS_BITACORA;

  main.innerHTML = `
    <h2 class="text-lg font-bold mb-4" style="color:${COLOR}">Bitácora del sistema</h2>
    <div class="max-w-2xl">
      ${alcanzoMax ? `<div class="p-3 rounded-lg mb-3 text-sm" style="background:#FDF3E3; color:#8A6100">⚠️ Se alcanzó el máximo recomendado de ${MAX_REGISTROS_BITACORA} registros. Exporta un respaldo en PDF cuanto antes.</div>` : ""}
      <button id="exportarPdfBtn" class="mb-3 px-3 py-1.5 rounded-lg text-sm font-bold text-white" style="background:${COLOR}">📄 Exportar PDF</button>
      <div class="space-y-2">
        ${registros.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Sin movimientos registrados todavía.</p>` : registros.map(l => `
          <div class="p-3 rounded-xl bg-white border" style="border-color:#E1DED5">
            <p class="text-sm font-semibold" style="color:${COLOR}">${l.accion}</p>
            <p class="text-xs" style="color:#1C2B3A">${l.detalle || ""}</p>
            <p class="text-xs mt-1" style="color:#6C7B8A">
              Por: ${l.realizado_por_nombre || "—"}
              ${l.autorizado_por_1_nombre ? " · Autorizó: " + l.autorizado_por_1_nombre : ""}
              ${l.autorizado_por_2_nombre ? ", " + l.autorizado_por_2_nombre : ""}
              ${l.autorizado_por_3_nombre ? " y " + l.autorizado_por_3_nombre : ""}
              · ${new Date(l.fecha_hora).toLocaleString("es-MX")}
            </p>
          </div>`).join("")}
      </div>
    </div>`;

  document.getElementById("exportarPdfBtn").addEventListener("click", async () => {
    try {
      await conProgreso("Generando PDF de la bitácora…", async () => exportarBitacoraPDF(registros));
    } catch (e) {
      avisoGlobal("No se pudo generar el PDF: " + traducirError(e), "error");
    }
  });
}

function exportarBitacoraPDF(registros) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "letter" });

  pdfEncabezado(doc, 20);
  doc.setFontSize(14);
  doc.setFont(undefined, "bold");
  doc.text("Bitácora — Sistema de Comités Escolares", 20, 47);
  doc.setFont(undefined, "normal");
  doc.setFontSize(9);
  doc.text(`Generado: ${new Date().toLocaleString("es-MX")} · Total de registros: ${registros.length}`, 20, 53);

  let y = 62;
  registros.forEach((r, i) => {
    if (y > 260) { doc.addPage(); y = pdfEncabezadoCorrido(doc, 20) + 4; }

    doc.setFont(undefined, "bold");
    doc.setFontSize(9);
    doc.text(`${i + 1}. ${r.accion} — ${new Date(r.fecha_hora).toLocaleString("es-MX")}`, 20, y);
    y += 5;

    doc.setFont(undefined, "normal");
    const detalle = doc.splitTextToSize(r.detalle || "", 170);
    doc.text(detalle, 20, y);
    y += detalle.length * 4.5;

    doc.setFontSize(8);
    const autorizacion = `Por: ${r.realizado_por_nombre || "—"}${r.autorizado_por_1_nombre ? " · Autorizó: " + r.autorizado_por_1_nombre : ""}${r.autorizado_por_2_nombre ? ", " + r.autorizado_por_2_nombre : ""}${r.autorizado_por_3_nombre ? " y " + r.autorizado_por_3_nombre : ""}`;
    doc.text(autorizacion, 20, y);
    doc.setFontSize(9);
    y += 7;
  });

  doc.save(`bitacora_comites_${new Date().toISOString().slice(0, 10)}.pdf`);
}

          <input id="ncNombre" placeholder="Nombre del comité" class="flex-1 px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
          <button id="ncGuardarBtn" class="px-3 py-1.5 rounded-lg text-sm font-bold text-white" style="background:${COLOR}">Agregar</button>
        </div>
        <div id="ncMsg" class="mt-2"></div>
      </div>
      <div class="space-y-2">
        ${(data || []).length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Sin comités capturados.</p>` : data.map(c => `
          <div class="p-3 rounded-xl bg-white border" style="border-color:#E1DED5">
            <p class="text-sm font-semibold" style="color:${COLOR}">${c.nombre}</p>
          </div>`).join("")}
      </div>
    </div>`;

  aplicarFiltroEnVivo("ncNombre", filtrarNombreComite);

    <div class="max-w-lg space-y-2">
      ${(data || []).length === 0 ? `<p class="text-sm" style="color:#6C7B8A">No hay solicitudes pendientes.</p>` : data.map((t, i) => `

          <p class="text-xs mb-2" style="color:#6C7B8A">${t.tipo} · Tel: ${t.telefono} · Vence: ${new Date(t.expira_en).toLocaleString("es-MX")}</p>
          <div class="flex gap-2">

}

// ============================================================
// Mi caja (Presidente/Tesorero): entradas y salidas
// ============================================================
async function renderCaja(main) {
  main.innerHTML = "";

  const [{ data: cuentaData, error: errCuenta }, { data: movsData, error: errMovs }] = await conProgreso("Cargando tu caja…", () => Promise.all([
    sb.rpc("mi_cuenta_obtener", { p_usuario_id: state.usuario.id }),
    sb.rpc("mis_movimientos_filtrar", { p_usuario_id: state.usuario.id, p_desde: null, p_hasta: null }),
  ]));
  if (errCuenta) { main.innerHTML = errBox(errCuenta.message); return; }
  if (errMovs) { main.innerHTML = errBox(traducirError(errMovs) + " (¿ya ejecutaste el SQL de mis_movimientos_filtrar?)"); return; }

  const cuenta = cuentaData[0];
  let movimientos = movsData || [];
  let estFiltro = { modo: "completo" };
  let msgFiltro = "";
  const tieneAcreimex = cuenta.saldo_acreimex !== null;
  let filtroCuenta = "Todas";

  function pintar() {
    const puedeSalida = Number(cuenta.saldo_caja_chica) > 0 || (tieneAcreimex && Number(cuenta.saldo_acreimex) > 0);
    const puedeTransferir = Number(cuenta.saldo_caja_chica) > 0;
    const listaMostrada = filtroCuenta === "Todas" ? movimientos : movimientos.filter(m => m.cuenta === filtroCuenta);
    main.innerHTML = `
      <h2 class="text-lg font-bold mb-4" style="color:${COLOR}">Mi caja</h2>
      <div class="max-w-2xl">
        <div class="grid ${tieneAcreimex ? "grid-cols-2" : "grid-cols-1"} gap-3 mb-4">
          <div class="p-4 rounded-xl bg-white border" style="border-color:#E1DED5">
            <p class="text-xs" style="color:#6C7B8A">Caja chica</p>
            <p class="text-2xl font-bold" style="color:${COLOR}">$${Number(cuenta.saldo_caja_chica).toFixed(2)}</p>
          </div>
          ${tieneAcreimex ? `
          <div class="p-4 rounded-xl bg-white border" style="border-color:#E1DED5">
            <p class="text-xs" style="color:#6C7B8A">Acreimex</p>
            <p class="text-2xl font-bold" style="color:${COLOR}">$${Number(cuenta.saldo_acreimex).toFixed(2)}</p>
          </div>` : ""}
        </div>

        <div class="flex gap-2 mb-2">
          <button id="btnNuevaEntrada" class="flex-1 py-2 rounded-lg text-sm font-bold text-white" style="background:#3F7A5E">+ Entrada</button>
          <button id="btnNuevaSalida" ${puedeSalida ? "" : "disabled"} class="flex-1 py-2 rounded-lg text-sm font-bold text-white" style="background:${puedeSalida ? "#B5453A" : "#B9C3CC"}; ${puedeSalida ? "" : "cursor:not-allowed"}">− Salida${puedeSalida ? "" : " (sin saldo)"}</button>
          <button id="btnNuevaTransferencia" ${puedeTransferir ? "" : "disabled"} class="flex-1 py-2 rounded-lg text-sm font-bold text-white" style="background:${puedeTransferir ? COLOR : "#B9C3CC"}; ${puedeTransferir ? "" : "cursor:not-allowed"}">🔁 Transferir${puedeTransferir ? "" : " (sin saldo)"}</button>
        </div>
        ${tieneAcreimex ? `<button id="btnAutoTransferencia" ${puedeSalida ? "" : "disabled"} class="text-xs underline mb-4" style="color:${puedeSalida ? COLOR : "#B9C3CC"}">Transferir entre mis 2 cuentas (Caja chica ↔ Acreimex)${puedeSalida ? "" : " (sin saldo)"}</button>` : ""}

        <div id="formMovWrap"></div>

        <div class="flex items-center justify-between mb-2">
          <p class="text-sm font-semibold" style="color:${COLOR}">Movimientos</p>
          ${tieneAcreimex ? `
          <select id="filtroCuentaSel" class="px-2 py-1 rounded-lg text-xs outline-none border" style="border-color:#E1DED5">
            <option value="Todas" ${filtroCuenta === "Todas" ? "selected" : ""}>Todas las cuentas</option>
            <option value="Caja chica" ${filtroCuenta === "Caja chica" ? "selected" : ""}>Solo caja chica</option>
            <option value="Acreimex" ${filtroCuenta === "Acreimex" ? "selected" : ""}>Solo Acreimex</option>
          </select>` : ""}
        </div>
        <div class="p-3 rounded-xl bg-white border mb-3" style="border-color:#E1DED5">
          ${periodoControlesHTML("fm", "Todos", estFiltro)}
          <button id="btnAplicarFiltro" class="px-3 py-1.5 rounded-lg text-xs font-bold text-white" style="background:${COLOR}">Buscar</button>
          <div id="filtroMsg" class="mt-2">${msgFiltro}</div>
        </div>
        <div class="space-y-2">
          ${listaMostrada.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Aún no hay movimientos.</p>` : listaMostrada.map((m, i) => `
            <div class="p-3 rounded-xl bg-white border" style="border-color:#E1DED5">
              <div class="flex items-center justify-between">
                <p class="text-sm font-semibold" style="color:${m.es_entrada ? "#3F7A5E" : "#B5453A"}">${m.es_entrada ? "+" : "−"} $${Number(m.monto).toFixed(2)} <span class="text-xs font-normal" style="color:#6C7B8A">(${m.cuenta})</span></p>
                <p class="text-xs" style="color:#6C7B8A">${new Date(m.creado_en).toLocaleDateString("es-MX")}</p>
              </div>
              <p class="text-xs" style="color:#1C2B3A">${m.tipo.startsWith("Transferencia") ? m.concepto : m.tipo + " — " + m.concepto}</p>
              ${m.comentarios ? `<p class="text-xs" style="color:#6C7B8A">${m.comentarios}</p>` : ""}
              <div class="flex items-center gap-3 mt-1">
                ${m.comprobante_path ? `<button class="verComprobanteBtn text-xs underline" data-idx="${i}" style="color:${COLOR}">Ver comprobante</button><button class="descargarComprobanteBtn text-xs underline" data-idx="${i}" style="color:${COLOR}">Descargar</button>` : ""}
                ${(m.tipo === "Entrada" || m.tipo === "Salida") ? `<button class="eliminarMovBtn text-xs underline" data-idx="${i}" style="color:#B5453A">Eliminar</button>` : ""}
              </div>
            </div>`).join("")}
        </div>
      </div>`;

    document.getElementById("btnNuevaEntrada").addEventListener("click", () => mostrarFormMovimiento("Entrada"));
    document.getElementById("btnNuevaSalida").addEventListener("click", () => { if (puedeSalida) mostrarFormMovimiento("Salida"); });
    document.getElementById("btnNuevaTransferencia").addEventListener("click", () => { if (puedeTransferir) mostrarFormTransferencia(); });
    const btnAuto = document.getElementById("btnAutoTransferencia");
    if (btnAuto) btnAuto.addEventListener("click", () => { if (puedeSalida) mostrarFormAutoTransferencia(); });

    const selFiltro = document.getElementById("filtroCuentaSel");
    if (selFiltro) selFiltro.addEventListener("change", (e) => { filtroCuenta = e.target.value; pintar(); });

    main.querySelectorAll(".verComprobanteBtn").forEach(b => b.addEventListener("click", async () => {
      const m = listaMostrada[Number(b.dataset.idx)];
      const { data, error } = await conProgreso("Abriendo comprobante…", () => sb.storage.from("comprobantes").createSignedUrl(m.comprobante_path, 300));
      if (error) { alert(traducirError(error)); return; }
      window.open(data.signedUrl, "_blank");
    }));

    main.querySelectorAll(".descargarComprobanteBtn").forEach(b => b.addEventListener("click", async () => {
      const m = listaMostrada[Number(b.dataset.idx)];
      const ext = (m.comprobante_path.split(".").pop() || "jpg").toLowerCase();
      const nombre = `comprobante_${m.tipo}_${new Date(m.creado_en).toISOString().slice(0, 10)}.${ext}`.replace(/\s+/g, "_");
      const { data, error } = await conProgreso("Preparando la descarga del comprobante…", () => sb.storage.from("comprobantes").createSignedUrl(m.comprobante_path, 300, { download: nombre }));
      if (error) { alert(traducirError(error)); return; }
      const a = document.createElement("a");
      a.href = data.signedUrl; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    }));

    periodoEnlazar("fm");
    document.getElementById("btnAplicarFiltro").addEventListener("click", async () => {
      const r = periodoLeer("fm");
      if (r.error) { document.getElementById("filtroMsg").innerHTML = errBox(r.error); return; }
      estFiltro = { modo: r.modo, mes: r.mes, anio: r.anio, desde: r.desde, hasta: r.hasta };
      const { data, error } = await conProgreso("Buscando movimientos…", () => sb.rpc("mis_movimientos_filtrar", {
        p_usuario_id: state.usuario.id,
        p_desde: r.modo === "completo" ? null : r.fechaInicio.toISOString(),
        p_hasta: r.modo === "completo" ? null : r.fechaFin.toISOString(),
      }));
      if (error) { document.getElementById("filtroMsg").innerHTML = errBox(error.message); return; }
      movimientos = data || [];
      msgFiltro = "";
      pintar();
    });

    main.querySelectorAll(".eliminarMovBtn").forEach(b => b.addEventListener("click", () => {
      mostrarFormEliminarMovimiento(listaMostrada[Number(b.dataset.idx)]);
    }));
  }

  function mostrarFormMovimiento(tipo) {
    const wrap = document.getElementById("formMovWrap");
    const esSalida = tipo === "Salida";
    wrap.innerHTML = `
      <div class="p-4 rounded-xl bg-white border mb-4" style="border-color:#E1DED5">
        <p class="text-sm font-semibold mb-2" style="color:${esSalida ? "#B5453A" : "#3F7A5E"}">Nueva ${tipo.toLowerCase()}</p>
        ${tieneAcreimex ? `
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Cuenta</label>
        <select id="movCuenta" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5">
          <option value="Caja chica">Caja chica</option>
          <option value="Acreimex">Acreimex</option>
        </select>` : ""}
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Monto</label>
        <input id="movMonto" type="number" step="0.01" min="0.01" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Concepto</label>
        <input id="movConcepto" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Comentarios (opcional)</label>
        <textarea id="movComentarios" rows="2" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5"></textarea>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Comprobante (foto)${esSalida ? " — obligatorio" : " — opcional"}</label>
        <input id="movComprobante" type="file" accept="image/*" capture="environment" class="w-full text-sm mb-2" />
        <div id="movMsg"></div>
        <div class="flex gap-2">
          <button id="movCancelar" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:${COLOR}">Cancelar</button>
          <button id="movGuardar" class="flex-1 py-2 rounded-lg text-sm font-bold text-white" style="background:${esSalida ? "#B5453A" : "#3F7A5E"}">Guardar</button>
        </div>
      </div>`;

    document.getElementById("movCancelar").addEventListener("click", () => { wrap.innerHTML = ""; });

    document.getElementById("movGuardar").addEventListener("click", async () => {
      const msg = document.getElementById("movMsg");
      msg.innerHTML = "";
      const monto = Number(document.getElementById("movMonto").value);
      const concepto = document.getElementById("movConcepto").value.trim();
      const comentarios = document.getElementById("movComentarios").value.trim();
      const archivo = document.getElementById("movComprobante").files[0];
      const cuentaSel = tieneAcreimex ? document.getElementById("movCuenta").value : "Caja chica";

      if (!monto || monto <= 0) { msg.innerHTML = errBox("Escribe un monto válido."); return; }
      if (!concepto) { msg.innerHTML = errBox("Escribe el concepto."); return; }
      if (esSalida && !archivo) { msg.innerHTML = errBox("Las salidas requieren subir un comprobante."); return; }

      const resultado = await conProgreso(archivo ? "Comprimiendo y subiendo comprobante…" : `Guardando ${tipo.toLowerCase()}…`, async () => {
        let comprobantePath = null;
        if (archivo) {
          try {
            comprobantePath = await subirComprobante(archivo);
          } catch (errSubida) {
            return { errorSubida: errSubida };
          }
          actualizarProgreso(`Guardando ${tipo.toLowerCase()}…`);
        }
        return await sb.rpc("movimiento_registrar", {
          p_usuario_id: state.usuario.id,
          p_tipo: tipo,
          p_cuenta: cuentaSel,
          p_monto: monto,
          p_concepto: concepto,
          p_comentarios: comentarios || null,
          p_comprobante_path: comprobantePath,
        });
      });

      if (resultado.errorSubida) { msg.innerHTML = errBox("No se pudo subir el comprobante: " + traducirError(resultado.errorSubida)); return; }
      if (resultado.error) { msg.innerHTML = errBox(resultado.error.message); return; }

      renderCaja(main);
    });
  }

  // ---------- Eliminar movimiento (con autorización) ----------
  function mostrarFormEliminarMovimiento(mov) {
    const esTesorero = cuenta.rol === "Tesorero";
    const rolContraparte = esTesorero ? "Presidente" : "Tesorero";
    const modal = document.createElement("div");
    modal.className = "fixed inset-0 z-50 flex items-center justify-center p-4";
    modal.style.background = "rgba(28,43,58,0.6)";

      <div class="rounded-2xl p-5 bg-white w-full max-w-sm">
        <p class="text-sm font-semibold mb-1" style="color:${COLOR}">Eliminar movimiento</p>
        <p class="text-xs mb-3" style="color:#6C7B8A">${mov.tipo} de $${Number(mov.monto).toFixed(2)} — ${mov.concepto}</p>
        <p class="text-xs mb-3" style="color:#6C7B8A">Requiere la autorización del ${rolContraparte} de tu comité y del Director.</p>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Contraseña del ${rolContraparte} de tu comité</label>
        ${campoPassword("elimContraparte", "mb-3")}
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Contraseña del Director</label>
        ${campoPassword("elimDirector", "mb-3")}
        <div id="elimMsg"></div>
        <div class="flex gap-2">
          <button id="elimCancelar" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:${COLOR}">Cancelar</button>
          <button id="elimConfirmar" class="flex-1 py-2 rounded-lg text-sm font-bold text-white" style="background:#B5453A">Eliminar</button>
        </div>

    document.getElementById("elimConfirmar").addEventListener("click", async () => {

        p_solicitante_id: state.usuario.id,
        p_movimiento_id: mov.id,
        p_password_contraparte: document.getElementById("elimContraparte").value,

      }));
      if (error) { msg.innerHTML = errBox(error.message); return; }

  // ---------- Transferencia a otra persona ----------
  async function mostrarFormTransferencia() {
    const wrap = document.getElementById("formMovWrap");
    wrap.innerHTML = "";

    const { data: destinatarios, error: errDest } = await conProgreso("Cargando destinatarios…", () => sb.rpc("usuarios_transferibles_listar"));
    if (errDest) { wrap.innerHTML = errBox(errDest.message); return; }
    const lista = (destinatarios || []).filter(d => d.id !== state.usuario.id);

    wrap.innerHTML = `
      <div class="p-4 rounded-xl bg-white border mb-4" style="border-color:#E1DED5">
        <p class="text-sm font-semibold mb-2" style="color:${COLOR}">Nueva transferencia</p>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">¿A quién le envías?</label>
        <select id="trDestino" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5">
          <option value="">Selecciona…</option>
          ${lista.map(d => `<option value="${d.id}" data-rol="${d.rol}" data-comite="${d.comite_id || ""}">${d.nombre_completo} — ${d.rol}${d.comite_nombre ? " de " + d.comite_nombre : ""}</option>`).join("")}
        </select>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Monto</label>
        <input id="trMonto" type="number" step="0.01" min="0.01" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Concepto (opcional)</label>
        <input id="trConcepto" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="border-color:#E1DED5" />
        <div id="trAutorizacionesWrap"></div>
        <div id="trMsg"></div>
        <div class="flex gap-2 mt-2">
          <button id="trCancelar" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:#F4F1EB; color:${COLOR}">Cancelar</button>
          <button id="trGuardar" class="flex-1 py-2 rounded-lg text-sm font-bold text-white" style="background:${COLOR}">Transferir</button>
        </div>
      </div>`;

    document.getElementById("trCancelar").addEventListener("click", () => { wrap.innerHTML = ""; });

    function pintarAutorizaciones() {
      const sel = document.getElementById("trDestino");
      const opt = sel.selectedOptions[0];
      const wrapAut = document.getElementById("trAutorizacionesWrap");
      if (!opt || !opt.value) { wrapAut.innerHTML = ""; return; }

      const comiteDestino = opt.dataset.comite || null;
      const mismoComite = comiteDestino === (cuenta.comite_id || "");
      const rolContraparte = cuenta.rol === "Tesorero" ? "Presidente" : "Tesorero";

      wrapAut.innerHTML = `
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Contraseña de quien recibe</label>
        ${campoPassword("trPassReceptor", "mb-2")}
        ${!mismoComite ? `
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Contraseña del ${rolContraparte} de tu comité</label>
        ${campoPassword("trPassContraparte", "mb-2")}` : ""}
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Contraseña del Director</label>
        ${campoPassword("trPassDirector", "mb-2")}`;
    }

    document.getElementById("trDestino").addEventListener("change", pintarAutorizaciones);

    document.getElementById("trGuardar").addEventListener("click", async () => {
      const msg = document.getElementById("trMsg");
      msg.innerHTML = "";
      const destinoId = document.getElementById("trDestino").value;
      const monto = Number(document.getElementById("trMonto").value);
      if (!destinoId) { msg.innerHTML = errBox("Selecciona a quién le envías."); return; }
      if (!monto || monto <= 0) { msg.innerHTML = errBox("Escribe un monto válido."); return; }

      const { error } = await conProgreso("Registrando transferencia…", () => sb.rpc("transferencia_registrar", {
        p_usuario_origen_id: state.usuario.id,
        p_usuario_destino_id: destinoId,
        p_monto: monto,
        p_concepto: document.getElementById("trConcepto").value.trim() || null,
        p_password_receptor: document.getElementById("trPassReceptor")?.value || null,
        p_password_contraparte_origen: document.getElementById("trPassContraparte")?.value || null,
        p_password_director: document.getElementById("trPassDirector")?.value || null,

// Helpers compartidos de periodo (Completo / Mensual / Personalizado)
// ============================================================
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

function periodoControlesHTML(id, etiquetaCompleto, est) {
  est = est || {};
  const hoy = new Date();
  const modo = est.modo || "completo";
  const mes = est.mes !== undefined ? est.mes : hoy.getMonth();
  const anio = est.anio !== undefined ? est.anio : hoy.getFullYear();
  const estilo = 'border-color:#E1DED5';
  const anios = [];
  for (let a = hoy.getFullYear(); a >= hoy.getFullYear() - 4; a--) anios.push(a);
  return `
    <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Periodo</label>
    <select id="${id}Modo" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="${estilo}">
      <option value="completo" ${modo === "completo" ? "selected" : ""}>${etiquetaCompleto}</option>
      <option value="mensual" ${modo === "mensual" ? "selected" : ""}>Mensual</option>
      <option value="personalizado" ${modo === "personalizado" ? "selected" : ""}>Periodo personalizado</option>
    </select>
    <div id="${id}MesWrap" style="display:${modo === "mensual" ? "grid" : "none"}" class="grid grid-cols-2 gap-2 mb-2">
      <select id="${id}Mes" class="px-2 py-2 rounded-lg text-sm outline-none border" style="${estilo}">
        ${MESES.map((m, i) => `<option value="${i}" ${i === mes ? "selected" : ""}>${m}</option>`).join("")}
      </select>
      <select id="${id}Anio" class="px-2 py-2 rounded-lg text-sm outline-none border" style="${estilo}">
        ${anios.map(a => `<option value="${a}" ${a === anio ? "selected" : ""}>${a}</option>`).join("")}
      </select>
    </div>
    <div id="${id}RangoWrap" style="display:${modo === "personalizado" ? "grid" : "none"}" class="grid grid-cols-2 gap-2 mb-2">
      <div>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Desde</label>
        <input id="${id}Desde" type="date" value="${est.desde || ""}" class="w-full px-2 py-1.5 rounded-lg text-sm outline-none border" style="${estilo}" />
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Hasta</label>
        <input id="${id}Hasta" type="date" value="${est.hasta || ""}" class="w-full px-2 py-1.5 rounded-lg text-sm outline-none border" style="${estilo}" />
      </div>
    </div>`;
}

function periodoEnlazar(id) {
  document.getElementById(id + "Modo").addEventListener("change", (e) => {
    document.getElementById(id + "MesWrap").style.display = e.target.value === "mensual" ? "grid" : "none";
    document.getElementById(id + "RangoWrap").style.display = e.target.value === "personalizado" ? "grid" : "none";
  });
}

function periodoLeer(id) {
  const modo = document.getElementById(id + "Modo").value;
  const mes = Number(document.getElementById(id + "Mes").value);
  const anio = Number(document.getElementById(id + "Anio").value);
  const desde = document.getElementById(id + "Desde").value;
  const hasta = document.getElementById(id + "Hasta").value;
  const base = { modo, mes, anio, desde, hasta };
  if (modo === "completo") {
    const fin = new Date(); fin.setHours(23, 59, 59, 999);
    return { ...base, fechaInicio: new Date(2000, 0, 1), fechaFin: fin, texto: "Completo" };
  }
  if (modo === "mensual") {
    return { ...base, fechaInicio: new Date(anio, mes, 1, 0, 0, 0), fechaFin: new Date(anio, mes + 1, 0, 23, 59, 59), texto: `${MESES[mes]} ${anio}` };
  }
  if (!desde || !hasta) return { ...base, error: "Selecciona las dos fechas del rango." };
  const fi = new Date(desde + "T00:00:00"), ff = new Date(hasta + "T23:59:59");
  if (fi > ff) return { ...base, error: "La fecha de inicio no puede ser posterior a la fecha final." };
  return { ...base, fechaInicio: fi, fechaFin: ff, texto: "Personalizado" };
}

// hist = movimientos de la cuenta en orden ascendente (es_entrada, monto, creado_en)
function construirEstadoCuenta(hist, saldoActual, rango) {
  const neto = hist.filter(h => new Date(h.creado_en) >= rango.fechaInicio)
    .reduce((s, h) => s + (h.es_entrada ? Number(h.monto) : -Number(h.monto)), 0);
  const balanceInicial = Number(saldoActual) - neto;
  let corrido = balanceInicial;
  const filas = hist.filter(h => { const f = new Date(h.creado_en); return f >= rango.fechaInicio && f <= rango.fechaFin; })
    .map(f => { corrido += f.es_entrada ? Number(f.monto) : -Number(f.monto); return { ...f, balance: corrido }; });
  const ini = rango.modo === "completo" ? (hist.length ? new Date(hist[0].creado_en) : new Date()) : rango.fechaInicio;
  const fin = rango.modo === "completo" ? new Date() : rango.fechaFin;
  return {
    balanceInicial, filas,
    fechaInicioTexto: ini.toLocaleDateString("es-MX"),
    fechaFinTexto: fin.toLocaleDateString("es-MX"),
  };
}

async function renderReportes(main) {
  main.innerHTML = "";
  const { data: cuentaData, error: errCuenta } = await conProgreso("Cargando tus datos…", () => sb.rpc("mi_cuenta_obtener", { p_usuario_id: state.usuario.id }));
  if (errCuenta) { main.innerHTML = errBox(errCuenta.message); return; }
  const cuenta = cuentaData[0];
  const tieneAcreimex = cuenta.saldo_acreimex !== null;
  let opcion = "estado";
  let estPeriodo = { modo: "completo" };

  const dinero = (n) => "$" + Number(n).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function pintar() {
    main.innerHTML = `
      <h2 class="text-lg font-bold mb-4" style="color:${COLOR}">Reportes</h2>
      <div class="max-w-md">
        <div class="flex gap-2 mb-4">
          <button id="opEstado" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:${opcion === "estado" ? COLOR : "#F4F1EB"}; color:${opcion === "estado" ? "#fff" : COLOR}">Estado de cuenta</button>
          <button id="opMov" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background:${opcion === "movimiento" ? COLOR : "#F4F1EB"}; color:${opcion === "movimiento" ? "#fff" : COLOR}">Reporte por Movimiento</button>
        </div>
        <div class="p-4 rounded-xl bg-white border" style="border-color:#E1DED5">
          <p class="text-xs mb-3" style="color:#6C7B8A">${opcion === "estado"
            ? "Incluye todos los movimientos del periodo (entradas, salidas y transferencias) con su balance."
            : "Elige un solo tipo de movimiento para conocer el total de recursos movidos en el periodo."}</p>
          ${tieneAcreimex ? `
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Cuenta</label>
          <select id="repCuenta" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
            <option value="Caja chica">Caja chica</option>
            <option value="Acreimex">Acreimex</option>
          </select>` : ""}
          ${opcion === "movimiento" ? `
          <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Tipo de movimiento</label>
          <select id="repTipo" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
            <option value="Entrada">Entradas</option>
            <option value="Salida">Salidas</option>
            <option value="Transferencia">Transferencias</option>
          </select>` : ""}
          ${periodoControlesHTML("rep", "Completo (desde el primer movimiento)", estPeriodo)}
          <div id="repMsg" class="mt-2"></div>
          <button id="repGenerar" class="w-full mt-2 py-2 rounded-lg text-sm font-bold text-white" style="background:${COLOR}">${opcion === "estado" ? "Generar PDF" : "Calcular total"}</button>
        </div>
        <div id="repResultado" class="mt-4"></div>
      </div>`;

    document.getElementById("opEstado").addEventListener("click", () => { opcion = "estado"; pintar(); });
    document.getElementById("opMov").addEventListener("click", () => { opcion = "movimiento"; pintar(); });
    periodoEnlazar("rep");
    document.getElementById("repGenerar").addEventListener("click", generar);
  }

  async function generar() {
    const msg = document.getElementById("repMsg");
    const res = document.getElementById("repResultado");
    msg.innerHTML = ""; res.innerHTML = "";

    const cuentaRep = tieneAcreimex ? document.getElementById("repCuenta").value : "Caja chica";
    const rango = periodoLeer("rep");
    if (rango.error) { msg.innerHTML = errBox(rango.error); return; }
    estPeriodo = { modo: rango.modo, mes: rango.mes, anio: rango.anio, desde: rango.desde, hasta: rango.hasta };

    const consulta = await conProgreso("Consultando movimientos…", async () => {
      const h = await sb.rpc("cuenta_historial_completo", { p_usuario_id: state.usuario.id, p_cuenta: cuentaRep });
      if (h.error || opcion !== "estado") return { h };
      actualizarProgreso("Obteniendo datos del Director…");
      const d = await sb.rpc("director_actual_obtener");
      return { h, d };
    });
    const { data: historial, error: errHist } = consulta.h;
    if (errHist) { msg.innerHTML = errBox(errHist.message); return; }
    const hist = historial || [];
    const cargo = `${cuenta.rol} de ${cuenta.comite_nombre || "—"}`.toUpperCase();

    if (opcion === "estado") {
      const directorData = consulta.d && consulta.d.data;
      const nombreDirector = (directorData && directorData[0] && directorData[0].nombre_completo) || "—";
      const saldoActual = cuentaRep === "Acreimex" ? cuenta.saldo_acreimex : cuenta.saldo_caja_chica;
      const est = construirEstadoCuenta(hist, saldoActual, rango);
      try {
        await conProgreso("Generando estado de cuenta en PDF…", async () => generarReporteEstadoCuentaPDF({
          titular: state.usuario.nombre_completo, cargo, rol: cuenta.rol, comite: cuenta.comite_nombre || "—", cuenta: cuentaRep,
          fechaInicioTexto: est.fechaInicioTexto, fechaFinTexto: est.fechaFinTexto,
          balanceInicial: est.balanceInicial, filas: est.filas, directorNombre: nombreDirector,
        }));
      } catch (e) {
        msg.innerHTML = errBox("No se pudo generar el PDF: " + traducirError(e));
        return;
      }
      res.innerHTML = okBox("Estado de cuenta generado.");
      return;
    }

    // Reporte por Movimiento (un solo tipo)
    const tipo = document.getElementById("repTipo").value;
    const categoriaDe = (t) => t === "Entrada" ? "Entrada" : t === "Salida" ? "Salida" : "Transferencia";
    const filas = hist.filter(h => {
      const f = new Date(h.creado_en);
      return f >= rango.fechaInicio && f <= rango.fechaFin && categoriaDe(h.tipo) === tipo;
    });
    const total = filas.reduce((s, h) => s + Number(h.monto), 0);
    const enviadas = filas.filter(h => !h.es_entrada).reduce((s, h) => s + Number(h.monto), 0);
    const recibidas = filas.filter(h => h.es_entrada).reduce((s, h) => s + Number(h.monto), 0);
    const nombreTipo = tipo === "Entrada" ? "Entradas" : tipo === "Salida" ? "Salidas" : "Transferencias";
    const periodoTxt = rango.modo === "completo"
      ? `Completo (hasta ${new Date().toLocaleDateString("es-MX")})`
      : rango.modo === "mensual" ? rango.texto
      : `${rango.fechaInicio.toLocaleDateString("es-MX")} al ${rango.fechaFin.toLocaleDateString("es-MX")}`;

    res.innerHTML = `
      <div class="p-4 rounded-xl bg-white border" style="border-color:#E1DED5">
        <p class="text-xs" style="color:#6C7B8A">${nombreTipo} · ${cuentaRep} · ${periodoTxt}</p>
        ${tipo === "Transferencia" ? `
          <p class="text-sm mt-2" style="color:#1C2B3A">Enviadas: <b>${dinero(enviadas)}</b></p>
          <p class="text-sm" style="color:#1C2B3A">Recibidas: <b>${dinero(recibidas)}</b></p>
          <p class="text-xs mt-1" style="color:#6C7B8A">Movimientos: ${filas.length}</p>
        ` : `
          <p class="text-2xl font-bold mt-1" style="color:${COLOR}">${dinero(total)}</p>
          <p class="text-xs" style="color:#6C7B8A">${filas.length} movimiento(s)</p>
        `}
        <button id="btnPdfMov" class="mt-3 px-3 py-1.5 rounded-lg text-xs font-semibold" style="background:#F4F1EB; color:${COLOR}">📄 Descargar PDF</button>
      </div>`;

    document.getElementById("btnPdfMov").addEventListener("click", async () => {
      try {
        await conProgreso("Generando PDF del reporte…", async () => {
          const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter", orientation: "portrait" });
          pdfEncabezado(doc, 12);
          doc.setFontSize(13); doc.setFont(undefined, "bold");
          doc.text(`REPORTE POR MOVIMIENTO: ${nombreTipo.toUpperCase()}`, 12, 46);
          doc.setFontSize(9); doc.setFont(undefined, "normal");
          doc.text(`Titular: ${String(state.usuario.nombre_completo).toUpperCase()}`, 12, 53);
          doc.text(`Cargo: ${cargo}`, 12, 58);
          doc.text(`Cuenta: ${cuentaRep}`, 12, 63);
          doc.text(`Periodo: ${periodoTxt}`, 12, 68);
          const resumen = tipo === "Transferencia"
            ? `Enviadas: ${dinero(enviadas)}   Recibidas: ${dinero(recibidas)}`
            : `Total ${nombreTipo.toLowerCase()}: ${dinero(total)}`;
          doc.setFont(undefined, "bold"); doc.text(resumen, 12, 75); doc.setFont(undefined, "normal");
          doc.autoTable({
            startY: 80,
            margin: { top: 20, left: 14, right: 14, bottom: 18 },
            didDrawPage: (d) => { if (d.pageNumber > 1) pdfEncabezadoCorrido(doc, 12); },
            head: [["No.", "Fecha y hora", "Concepto", "Tipo", "Monto"]],
            body: filas.map((f, i) => [String(i + 1),
              new Date(f.creado_en).toLocaleString("es-MX", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }),
              f.concepto || "", f.tipo, dinero(f.monto)]),
            styles: { fontSize: 8 }, headStyles: { fillColor: [28, 43, 58] },
            columnStyles: { 4: { halign: "right" } },
          });
          const tp = doc.internal.getNumberOfPages();
          for (let p = 1; p <= tp; p++) {
            doc.setPage(p); doc.setFontSize(8);
            doc.text(`${p}/${tp}`, doc.internal.pageSize.getWidth() - 20, doc.internal.pageSize.getHeight() - 10);
          }
          doc.save(`reporte_${tipo.toLowerCase()}_${new Date().toISOString().slice(0, 10)}.pdf`);
        });
      } catch (e) {
        avisoGlobal("No se pudo generar el PDF: " + traducirError(e), "error");
      }
    });
  }

  pintar();
}

// ============================================================
// Genera el PDF del reporte (estado de cuenta) con autoTable
// ============================================================
function generarReporteEstadoCuentaPDF({ titular, cargo, rol, comite, cuenta, fechaInicioTexto, fechaFinTexto, balanceInicial, filas, directorNombre }) {
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter", orientation: "portrait" });

  const body = filas.map((f, i) => [
    String(i + 1),
    new Date(f.creado_en).toLocaleString("es-MX", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }),
    f.concepto || "",
    f.tipo,
    f.es_entrada ? `$${Number(f.monto).toFixed(2)}` : "",
    !f.es_entrada ? `$${Number(f.monto).toFixed(2)}` : "",
    `$${Number(f.balance).toFixed(2)}`,
  ]);

  doc.autoTable({
    startY: 76,
    head: [["No.", "Fecha y hora", "Concepto", "Tipo", "Entradas", "Salidas", "Balance"]],
    body,
    styles: { fontSize: 7, cellPadding: 1.5, valign: "middle" },
    headStyles: { fillColor: [28, 61, 90] },
    columnStyles: {
      0: { cellWidth: 8 },
      1: { cellWidth: 26 },
      2: { cellWidth: 56 },
      3: { cellWidth: 24 },
      4: { cellWidth: 22, halign: "right" },
      5: { cellWidth: 22, halign: "right" },
      6: { cellWidth: 24, halign: "right" },
    },
    margin: { top: 20, bottom: 25, left: 12, right: 12 },
    didDrawPage: (data) => {
      if (data.pageNumber === 1) {
        pdfEncabezado(doc, 12);
        doc.setFontSize(13);
        doc.setFont(undefined, "bold");
        doc.text("ESTADO DE CUENTA — SISTEMA DE COMITÉS ESCOLARES", 12, 46);
        doc.setFont(undefined, "normal");
        doc.setFontSize(9);
        doc.text(`Titular: ${titular}`, 12, 53);
        doc.text(`Cargo: ${String(cargo).toUpperCase()}`, 12, 58);
        doc.text(`Cuenta: ${cuenta}`, 12, 63);
        doc.text(`Periodo: ${fechaInicioTexto} a ${fechaFinTexto}`, 12, 68);
        doc.text(`Balance inicial: $${Number(balanceInicial).toFixed(2)}`, 12, 73);
      } else {
        pdfEncabezadoCorrido(doc, 12);
      }
    },
  });

  // Decide en qué página van las firmas (si no cabe, se agrega una hoja nueva)
  let paginaFirmas = doc.internal.getNumberOfPages();
  doc.setPage(paginaFirmas);
  let yFirma = (doc.lastAutoTable ? doc.lastAutoTable.finalY : 50) + 25;
  const alturaUtil = doc.internal.pageSize.getHeight() - 25;
  if (yFirma + 20 > alturaUtil) {
    doc.addPage();
    paginaFirmas = doc.internal.getNumberOfPages();
    yFirma = 35;
  }

  // Firmas (solo en la página final)
  doc.setPage(paginaFirmas);
  const lineasElabora = [String(titular).toUpperCase()];
  if (rol && comite) { lineasElabora.push(String(rol).toUpperCase(), "COMITÉ " + String(comite).toUpperCase()); }
  else lineasElabora.push(String(cargo).toUpperCase());
  pdfFirma(doc, 12, 78, yFirma, "Elaboró:", lineasElabora);
  pdfFirma(doc, 125, 73, yFirma, "Autorizó:", [
    String(directorNombre || "—").toUpperCase(),
    "DIRECTOR",
    ESCUELA.nombre.toUpperCase(),
  ]);

  // Numeración X/Y en todas las páginas (se hace al final, ya con el total correcto)
  const totalPaginas = doc.internal.getNumberOfPages();
  for (let p = 1; p <= totalPaginas; p++) {
    doc.setPage(p);
    doc.setFontSize(8);
    doc.text(`${p}/${totalPaginas}`, doc.internal.pageSize.getWidth() - 20, doc.internal.pageSize.getHeight() - 10);
  }

  doc.save(`estado_cuenta_${cuenta.toLowerCase().replace(" ", "_")}_${new Date().toISOString().slice(0, 10)}.pdf`);
}

init();
