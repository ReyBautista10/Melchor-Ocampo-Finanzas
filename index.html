<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas Escuela Primaria - Orizaba</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen">
<div class="max-w-6xl mx-auto p-4 md:p-6">
  <div class="bg-white rounded-2xl shadow p-5 flex flex-col md:flex-row justify-between items-center gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Finanzas Comité Escolar</h1>
      <p class="text-sm text-slate-500">Primaria Orizaba - Ciclo 2025-2026</p>
    </div>
    <div class="flex gap-3">
      <div class="bg-emerald-50 px-4 py-2 rounded-xl text-center">
        <p class="text-xs text-emerald-600">INGRESOS</p>
        <p id="totalIngresos" class="font-bold text-emerald-700 text-xl">$0</p>
      </div>
      <div class="bg-red-50 px-4 py-2 rounded-xl text-center">
        <p class="text-xs text-red-600">EGRESOS</p>
        <p id="totalEgresos" class="font-bold text-red-700 text-xl">$0</p>
      </div>
      <div class="bg-blue-50 px-4 py-2 rounded-xl text-center">
        <p class="text-xs text-blue-600">SALDO</p>
        <p id="totalSaldo" class="font-bold text-blue-700 text-xl">$0</p>
      </div>
    </div>
  </div>

  <div class="grid md:grid-cols-3 gap-6 mt-6">
    <div class="bg-white rounded-2xl shadow p-5 md:col-span-1">
      <h2 class="font-bold mb-4">Registrar Movimiento</h2>
      <form id="formMov" class="space-y-3">
        <select id="tipo" class="w-full border rounded-lg p-2.5" required>
          <option value="ingreso">Ingreso (Cuota, Donativo)</option>
          <option value="egreso">Egreso (Compra, Pago)</option>
        </select>
        <input id="concepto" placeholder="Concepto ej: Cuota Juan Perez" class="w-full border rounded-lg p-2.5" required>
        <input id="nombre_completo" placeholder="Nombre completo del alumno / proveedor" class="w-full border rounded-lg p-2.5" required>
        <input id="monto" type="number" step="0.01" placeholder="Monto $" class="w-full border rounded-lg p-2.5" required>
        <input id="fecha" type="date" class="w-full border rounded-lg p-2.5" required>
        <input id="comprobante" type="file" accept="image/*,application/pdf" class="w-full text-sm">
        <textarea id="notas" placeholder="Notas" class="w-full border rounded-lg p-2.5"></textarea>
        <button class="w-full bg-slate-900 text-white rounded-lg py-3 font-bold">Guardar</button>
      </form>
    </div>

    <div class="bg-white rounded-2xl shadow p-5 md:col-span-2">
      <h2 class="font-bold mb-4">Historial</h2>
      <div class="overflow-auto max-h-[600px]">
        <table class="w-full text-sm">
          <thead class="text-slate-400 sticky top-0 bg-white"><tr><th class="text-left py-2">Fecha</th><th class="text-left">Tipo</th><th class="text-left">Concepto</th><th class="text-left">Monto</th><th></th></tr></thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
