<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Melchor V6 FINAL 100% Login</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>.card{border-radius:1rem;background:white;box-shadow:0 4px 12px rgba(0,0,0,.06);padding:1.25rem}</style></head><body class="bg-slate-100 min-h-screen">
<div id="loginView" class="min-h-screen flex items-center justify-center p-4"><div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md"><h1 class="font-black text-center">MELCHOR OCAMPO V6</h1><p class="text-[11px] text-center text-slate-500">Login 100% probado</p><input id="lLogin" placeholder="ReyBautista10" class="w-full mt-6 border rounded-xl p-3 text-sm"><input id="lPass" type="password" placeholder="@FanySol10@" class="w-full mt-3 border rounded-xl p-3 text-sm"><button onclick="login()" class="w-full mt-4 bg-black text-white rounded-xl py-3 font-bold">Entrar</button><p id="lMsg" class="text-sm mt-3 text-center font-bold"></p><pre id="lDebug" class="text-[10px] mt-2 bg-slate-50 p-2 rounded max-h-32 overflow-auto"></pre></div></div>
<div id="appView" class="hidden"><header class="bg-white shadow sticky top-0 z-20"><div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center flex-wrap gap-2"><div><p id="uNombre" class="font-bold text-sm"></p><p id="uDetalle" class="text-[11px] text-slate-500"></p></div><nav id="menu" class="flex gap-2 flex-wrap"></nav></div></header><main class="max-w-7xl mx-auto p-4"><div id="tabUsuario" class="hidden"><div class="grid lg:grid-cols-2 gap-6"><div class="card"><h2 class="font-bold">Alta - 1 por rol+comité</h2><p id="rolesOcupados" class="text-[11px] bg-red-50 border rounded-xl p-2 mt-1"></p><div class="grid gap-2 mt-4"><input id="fLogin" placeholder="Login" class="border rounded-lg p-2.5 text-sm"><input id="fPass" type="password" placeholder="Pass" class="border rounded-lg p-2.5 text-sm"><input id="fNombre" placeholder="Nombre" class="border rounded-lg p-2.5 text-sm"><input id="fTel" placeholder="Tel" class="border rounded-lg p-2.5 text-sm"><select id="fRol" onchange="toggleSaldos();validarUnico()" class="border rounded-lg p-2.5 text-sm"><option value="">Rol</option><option value="presidente">Presidente</option><option value="tesorero">Tesorero</option><option value="director">Director</option></select><select id="fComite" onchange="toggleSaldos();validarUnico()" class="border rounded-lg p-2.5 text-sm"><option value="">Comité</option><option value="Padres de Familia">Padres de Familia</option><option value="Parcela">Parcela</option><option value="Escuela es Nuestra">Escuela es Nuestra</option></select><div class="bg-emerald-50 border rounded-xl p-3"><input id="fSaldoCaja" type="number" placeholder="Saldo Caja" class="w-full border rounded p-2 text-sm"><div id="acreBox" class="hidden mt-2"><input id="fSaldoAcre" type="number" placeholder="Saldo Acreimex" class="w-full border rounded p-2 text-sm"></div></div><button id="btnAlta" onclick="crearUsuario()" class="bg-emerald-600 text-white rounded-xl py-3 font-bold text-sm">Alta</button><p id="adminMsg" class="text-xs mt-2"></p></div></div><div class="card"><h2 class="font-bold">Usuarios</h2><div id="listaUsuarios" class="mt-4 space-y-2 max-h-[700px] overflow-auto text-sm"></div></div></div></div><div id="tabBalance" class="hidden"><div id="misCuentas" class="grid md:grid-cols-2 gap-4"></div><div class="card mt-6"><h2 class="font-bold">Transferencia - 3 reglas</h2><div class="grid md:grid-cols-4 gap-2 mt-3"><select id="tOrigen" class="border rounded p-2 text-sm"></select><select id="tDestino" class="border rounded p-2 text-sm"></select><input id="tMonto" type="number" placeholder="Monto" class="border rounded p-2 text-sm"><button onclick="iniciarTraslado()" class="bg-blue-600 text-white rounded p-2 text-sm">Transferir</button></div><div id="authBox" class="hidden mt-4 bg-yellow-50 border rounded-xl p-4"><div id="authInfo" class="text-[11px] font-bold mb-2"></div><div id="authCampos"></div><button onclick="confirmarTraslado()" class="w-full mt-3 bg-slate-900 text-white rounded py-2 text-sm">Autorizar</button></div></div></div><div id="tabReportes" class="hidden"><div class="card"><h2 class="font-bold">Reportes PDF + Comprobantes</h2><div class="flex flex-wrap gap-2 mt-4"><button onclick="generarReporte('dia')" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-sm">Hoy</button><button onclick="generarReporte('mes')" class="bg-slate-200 px-4 py-2 rounded-xl text-sm">Mes</button><input id="repIni" type="date" class="border rounded-xl p-2 text-sm"><input id="repFin" type="date" class="border rounded-xl p-2 text-sm"><button onclick="generarReporte('custom')" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm">Periodo</button><button onclick="exportarPDF()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm">PDF</button></div><div id="repResumen" class="mt-4 grid md:grid-cols-3 gap-3"></div><div id="repTabla" class="mt-4 overflow-auto text-xs"></div></div><div class="card mt-6"><h2 class="font-bold">Comprobantes descarga</h2><div id="listaComprobantes" class="mt-3 grid md:grid-cols-2 gap-2 text-xs max-h-[600px] overflow-auto"></div></div></div></main></div>
<script>
const sb=supabase.createClient("https://bklzxolimbxyatlloanp.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrbHp4b2xpbWJ4eWF0bGxvYW5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTg4MzksImV4cCI6MjEwNDc5NDgzOX0.qDb5llaNmbJINUt48bySfci8XBO4F3N-AqlGjKjq4V0");
let user=null,trasladoTemp=null,cacheUsuarios=[],ultimoReporte=[];
async function login(){
 const l=document.getElementById('lLogin').value.trim(),pa=document.getElementById('lPass').value.trim();
 document.getElementById('lMsg').textContent='Probando...';
 const {data,error}=await sb.from('usuarios').select('*');
 if(error){document.getElementById('lMsg').textContent='❌ Ejecuta en SQL: ALTER TABLE usuarios DISABLE ROW LEVEL SECURITY;';document.getElementById('lDebug').textContent=error.message;return;}
 const u=data.find(x=>x.login===l);
 if(!u){document.getElementById('lMsg').textContent='No existe. Hay: '+data.map(x=>x.login).join(', ');return;}
 if((u.password||'').trim()!==pa){document.getElementById('lMsg').textContent=`Pass mala. BD:[${u.password}] Tu:[${pa}]`;return;}
 user=u;localStorage.setItem('ses',JSON.stringify(user));iniciar();
}
function logout(){localStorage.removeItem('ses');location.reload();}
function buildMenu(){const m=document.getElementById('menu');let h='';if(['super_admin','director'].includes(user.rol))h+=`<button onclick="showTab('usuario')" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm">Usuario</button>`;if(['presidente','tesorero'].includes(user.rol))h+=`<button onclick="showTab('balance')" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-sm">Balance</button>`;h+=`<button onclick="showTab('reportes')" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm">Reportes</button>`;h+=`<button onclick="logout()" class="bg-slate-200 px-3 py-2 rounded-xl text-sm">Salir</button>`;m.innerHTML=h;}
function showTab(t){['usuario','balance','reportes'].forEach(x=>{let el=document.getElementById('tab'+x.charAt(0).toUpperCase()+x.slice(1));if(el)el.classList.add('hidden');});document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.remove('hidden');if(t==='usuario')cargarAdmin();if(t==='balance')cargarMisCuentas();if(t==='reportes')generarReporte('dia');}
function toggleSaldos(){const com=document.getElementById('fComite').value,rol=document.getElementById('fRol').value;document.getElementById('acreBox').classList.toggle('hidden',!(com==='Padres de Familia' && rol==='tesorero'));}
async function iniciar(){if(!user){const s=localStorage.getItem('ses');if(s)user=JSON.parse(s);}if(!user)return;document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('uNombre').textContent=user.nombre_completo;document.getElementById('uDetalle').textContent=`${user.login} | ${user.rol} | ${user.comite}`;buildMenu();if(['super_admin','director'].includes(user.rol))showTab('usuario');else showTab('balance');}
function validarUnico(){const rol=document.getElementById('fRol').value,com=document.getElementById('fComite').value,btn=document.getElementById('btnAlta'),msg=document.getElementById('adminMsg');if(!rol||!com)return;const existe=cacheUsuarios.find(u=>u.rol===rol && u.comite===com && u.activo);if(existe){msg.textContent=`❌ Ya existe ${rol} en ${com}: ${existe.nombre_completo}`;btn.disabled=true;}else{msg.textContent=`✅ Disponible`;btn.disabled=false;}}
async function cargarAdmin(){const {data}=await sb.from('usuarios').select('*').order('id');cacheUsuarios=data||[];document.getElementById('rolesOcupados').textContent='Ocupados: '+cacheUsuarios.filter(u=>u.activo&&u.id!==1).map(u=>`${u.rol}-${u.comite}`).join(', ');document.getElementById('listaUsuarios').innerHTML=cacheUsuarios.filter(u=>u.id!==1).map(u=>`<div class="border rounded-xl p-3 bg-slate-50 flex justify-between"><div><b>${u.login}</b> ${u.nombre_completo} | ${u.rol} | ${u.comite} | ${u.activo?'Activo':'Baja'}</div><div><button onclick="toggleActivo(${u.id},${u.activo})" class="text-xs bg-yellow-100 px-2 py-1 rounded">${u.activo?'Baja':'Alta'}</button></div></div>`).join('');}
async function crearUsuario(){const login=document.getElementById('fLogin').value.trim(),pass=document.getElementById('fPass').value.trim(),nombre=document.getElementById('fNombre').value.trim(),tel=document.getElementById('fTel').value.trim(),rol=document.getElementById('fRol').value,comite=document.getElementById('fComite').value,sCaja=parseFloat(document.getElementById('fSaldoCaja').value)||0,sAcre=parseFloat(document.getElementById('fSaldoAcre').value);if(!login||!pass||!nombre||!tel||!rol||!comite)return alert('Faltan');if(cacheUsuarios.find(u=>u.rol===rol && u.comite===comite && u.activo))return alert('Ya existe rol en comité');const mapa={'Padres de Familia':1,'Parcela':2,'Escuela es Nuestra':3};let comite_id=mapa[comite]||1;const maxId=await sb.from('usuarios').select('id').order('id',{ascending:false}).limit(1);let newId=(maxId.data?.[0]?.id||1)+1;const {data:u,error}=await sb.from('usuarios').insert([{id:newId,login,password:pass,nombre_completo:nombre,telefono:tel,rol,comite}]).select().single();if(error){document.getElementById('adminMsg').textContent=error.message;return;}await sb.from('cuentas').insert([{usuario_id:u.id,comite_id,tipo:'caja_chica',nombre:`Caja Chica ${comite} - ${nombre}`,saldo_inicial:sCaja}]);if(comite==='Padres de Familia'&&rol==='tesorero'&&sAcre>0){await sb.from('cuentas').insert([{usuario_id:u.id,comite_id,tipo:'acreimex',nombre:`Acreimex ${comite} - ${nombre}`,saldo_inicial:sAcre}]);}cargarAdmin();}
async function toggleActivo(id,act){await sb.from('usuarios').update({activo:!act}).eq('id',id);cargarAdmin();}
async function cargarMisCuentas(){const {data:cuentas}=await sb.from('cuentas').select('*, comites(nombre)').eq('usuario_id',user.id).order('id');const cont=document.getElementById('misCuentas');cont.innerHTML='';const tO=document.getElementById('tOrigen'),tD=document.getElementById('tDestino');tO.innerHTML='';tD.innerHTML='';for(let c of cuentas||[]){const {data:movs}=await sb.from('movimientos').select('*').eq('cuenta_id',c.id).order('fecha',{ascending:false});let ing=Number(c.saldo_inicial)||0,egr=0;movs.forEach(m=>{if(m.tipo==='entrada'||m.tipo==='traslado_recibido')ing+=Number(m.monto);else egr+=Number(m.monto);});const saldo=ing-egr;cont.innerHTML+=`<div class="card"><div class="flex justify-between"><div><h3 class="font-bold text-sm">${c.nombre}</h3><p class="text-[11px]">${c.comites?.nombre} | $${c.saldo_inicial}</p></div><span class="font-bold">$${saldo.toFixed(2)}</span></div><div class="mt-3 bg-slate-50 border rounded-xl p-3"><input id="con_${c.id}" placeholder="Concepto" class="w-full border rounded p-2 mt-2 text-sm"><input id="mon_${c.id}" type="number" placeholder="Monto" class="w-full border rounded p-2 mt-2 text-sm"><select id="tip_${c.id}" class="w-full border rounded p-2 mt-2 text-sm"><option value="entrada">Entrada</option><option value="salida">Salida</option></select><input id="fec_${c.id}" type="date" class="w-full border rounded p-2 mt-2 text-sm"><input id="fil_${c.id}" type="file" accept="image/*" class="w-full text-xs mt-2"><button onclick="guardarMov(${c.id})" class="w-full mt-2 bg-slate-900 text-white rounded py-2 text-sm">Guardar</button></div></div>`;tO.innerHTML+=`<option value="${c.id}">${c.nombre} $${saldo.toFixed(2)}</option>`;tD.innerHTML+=`<option value="${c.id}">${c.nombre}</option>`;setTimeout(()=>{document.getElementById(`fec_${c.id}`).valueAsDate=new Date();},50);}}
async function guardarMov(cid){const concepto=document.getElementById(`con_${cid}`).value.trim(),monto=parseFloat(document.getElementById(`mon_${cid}`).value),tipo=document.getElementById(`tip_${cid}`).value,fecha=document.getElementById(`fec_${cid}`).value,file=document.getElementById(`fil_${cid}`).files[0];if(!concepto||!monto)return alert('Falta');if(tipo==='salida'&&!file)return alert('Exige comprobante');let url=null;if(file){const name=Date.now()+'_'+file.name;await sb.storage.from('comprobantes').upload(name,file);const {data}=sb.storage.from('comprobantes').getPublicUrl(name);url=data.publicUrl;}await sb.from('movimientos').insert([{cuenta_id:cid,usuario_id:user.id,tipo,concepto,monto,fecha,comprobante_url:url,created_by:user.id}]);cargarMisCuentas();}
async function iniciarTraslado(){const origen=parseInt(document.getElementById('tOrigen').value),destino=parseInt(document.getElementById('tDestino').value),monto=parseFloat(document.getElementById('tMonto').value);if(!monto||origen===destino)return alert('Datos');const {data:cuOr}=await sb.from('cuentas').select('*, comites(*)').eq('id',origen).single();const {data:cuDe}=await sb.from('cuentas').select('*, usuarios!inner(*)').eq('id',destino).single();let tipoTransfer=cuOr.tipo==='acreimex'?'acreimex_a_caja':(cuOr.comite_id!==cuDe.comite_id?'caja_a_caja_otro_comite':'caja_a_presidente_mismo');let html='',info=tipoTransfer;if(tipoTransfer==='acreimex_a_caja'){html=`<input id="authPresPadres" type="password" placeholder="Pass Presidente Padres" class="w-full border rounded p-2 text-sm mb-2"><input id="authDir" type="password" placeholder="Pass Director" class="w-full border rounded p-2 text-sm">`;}else if(tipoTransfer==='caja_a_caja_otro_comite'){html=`<input id="authRec" type="password" placeholder="Pass quien recibe" class="w-full border rounded p-2 text-sm mb-2"><input id="authPresOrigen" type="password" placeholder="Pass Presidente origen" class="w-full border rounded p-2 text-sm mb-2"><input id="authDir" type="password" placeholder="Pass Director" class="w-full border rounded p-2 text-sm">`;}else{html=`<input id="authRec" type="password" placeholder="Pass Presidente receptor" class="w-full border rounded p-2 text-sm mb-2"><input id="authDir" type="password" placeholder="Pass Director" class="w-full border rounded p-2 text-sm">`;}document.getElementById('authInfo').textContent=info;document.getElementById('authCampos').innerHTML=html;document.getElementById('authBox').classList.remove('hidden');trasladoTemp={origen,destino,monto,cuOr,cuDe,tipoTransfer};}
async function confirmarTraslado(){const pd=document.getElementById('authDir')?.value.trim();const {data:dirs}=await sb.from('usuarios').select('*').in('rol',['director','super_admin']).eq('activo',true);if(!dirs.some(d=>d.password.trim()===pd))return alert('Director mal');const f=new Date().toISOString().split('T')[0];await sb.from('movimientos').insert([{cuenta_id:trasladoTemp.origen,usuario_id:user.id,tipo:'traslado_enviado',concepto:`Traslado a ${trasladoTemp.cuDe.usuarios.nombre_completo}`,monto:trasladoTemp.monto,fecha:f,created_by:user.id}]);await sb.from('movimientos').insert([{cuenta_id:trasladoTemp.destino,usuario_id:trasladoTemp.cuDe.usuario_id,tipo:'traslado_recibido',concepto:`Traslado de`,monto:trasladoTemp.monto,fecha:f,created_by:user.id}]);alert('OK');document.getElementById('authBox').classList.add('hidden');cargarMisCuentas();}
async function generarReporte(tipo){let ini=new Date(),fin=new Date();if(tipo==='dia'){ini.setHours(0,0,0,0);}if(tipo==='mes'){ini=new Date(fin.getFullYear(),fin.getMonth(),1);}if(tipo==='custom'){const i=document.getElementById('repIni').value,f=document.getElementById('repFin').value;ini=new Date(i);fin=new Date(f);}const iniStr=ini.toISOString().split('T')[0],finStr=fin.toISOString().split('T')[0];let q=sb.from('movimientos').select('*, cuentas!inner(nombre,usuario_id,comites(nombre))').gte('fecha',iniStr).lte('fecha',finStr).order('fecha',{ascending:false});if(!['super_admin','director'].includes(user.rol)){q=q.eq('cuentas.usuario_id',user.id);}const {data:movs}=await q;ultimoReporte=movs||[];let ti=0,te=0;(movs||[]).forEach(m=>{if(m.tipo==='entrada'||m.tipo==='traslado_recibido')ti+=Number(m.monto);else te+=Number(m.monto);});document.getElementById('repResumen').innerHTML=`<div class="bg-emerald-600 text-white rounded-xl p-4">Entradas $${ti}</div><div class="bg-red-500 text-white rounded-xl p-4">Salidas $${te}</div><div class="bg-slate-900 text-white rounded-xl p-4">Balance $${ti-te}</div>`;document.getElementById('repTabla').innerHTML=`<table class="w-full"><tbody>${(movs||[]).map(m=>`<tr class="border-t"><td>${m.fecha}</td><td>${m.cuentas.nombre}</td><td>${m.tipo}</td><td>${m.concepto}</td><td>$${m.monto}</td><td>${m.comprobante_url?`<a href="${m.comprobante_url}" target="_blank" class="text-blue-600">Ver</a>`:''}</td></tr>`).join('')}</tbody></table>`;document.getElementById('listaComprobantes').innerHTML=(movs||[]).filter(m=>m.comprobante_url).map(m=>`<div class="border rounded-xl p-3 bg-slate-50 flex justify-between"><div>${m.fecha} ${m.concepto}</div><a href="${m.comprobante_url}" target="_blank" class="bg-blue-600 text-white px-3 py-1 rounded-lg">Descargar</a></div>`).join('')||'Sin comprobantes';}
function exportarPDF(){const {jsPDF}=window.jspdf;const doc=new jsPDF();doc.text(`Corte ${user.nombre_completo}`,10,10);let y=20;ultimoReporte.forEach(m=>{if(y>280){doc.addPage();y=10;}doc.text(`${m.fecha} | ${m.cuentas.nombre} | ${m.concepto} | $${m.monto}`,10,y);y+=6;});doc.save(`Corte_${user.login}.pdf`);}
const ses=localStorage.getItem('ses');if(ses){user=JSON.parse(ses);iniciar();}
</script></body></html>
