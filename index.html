<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Melchor V4</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.card{border-radius:1rem;background:white;box-shadow:0 4px 12px rgba(0,0,0,.06);padding:1.25rem}</style></head><body class="bg-slate-100 min-h-screen">
<div id="loginView" class="min-h-screen flex items-center justify-center p-4"><div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md"><h1 class="font-black text-center">MELCHOR OCAMPO</h1><p class="text-center text-[11px] text-slate-500">V4 Fix Login</p><input id="lLogin" placeholder="Login" class="w-full mt-6 border rounded-xl p-3 text-sm"><input id="lPass" type="password" placeholder="Contraseña" class="w-full mt-3 border rounded-xl p-3 text-sm"><button onclick="login()" class="w-full mt-4 bg-slate-900 text-white rounded-xl py-3 font-bold text-sm">Entrar</button><a onclick="document.getElementById('recBox').classList.toggle('hidden')" class="text-center block text-sm text-blue-600 mt-3 underline cursor-pointer">Recuperar por teléfono</a><div id="recBox" class="hidden mt-3 bg-blue-50 p-4 rounded-xl border"><input id="rLogin" placeholder="Tu login" class="w-full border rounded p-2 mb-2 text-sm"><input id="rTel" placeholder="Teléfono" class="w-full border rounded p-2 mb-2 text-sm"><button onclick="validarTelefono()" class="w-full bg-blue-600 text-white rounded py-2 text-sm">Validar</button><div id="newPassBox" class="hidden mt-3 border-t pt-3"><input id="rNewPass" type="password" placeholder="Nueva" class="w-full border rounded p-2 mb-2 text-sm"><button onclick="cambiarPass()" class="w-full bg-emerald-600 text-white rounded py-2 text-sm">Cambiar</button></div></div><p id="lMsg" class="text-red-600 text-sm text-center mt-3"></p><p id="lDebug" class="text-[10px] text-slate-400 text-center mt-2"></p></div></div>
<div id="appView" class="hidden"><header class="bg-white shadow sticky top-0 z-20"><div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center"><div><p id="uNombre" class="font-bold text-sm"></p><p id="uDetalle" class="text-[11px] text-slate-500"></p></div><nav id="menu" class="flex gap-2"></nav></div></header><main class="max-w-7xl mx-auto p-4">
<div id="tabUsuario" class="hidden"><div class="grid lg:grid-cols-2 gap-6"><div class="card"><h2 class="font-bold">Alta Usuario</h2><div class="grid gap-2 mt-4"><input id="fLogin" placeholder="Login" class="border rounded-lg p-2.5 text-sm"><input id="fPass" type="password" placeholder="Pass Tes@12345" class="border rounded-lg p-2.5 text-sm"><input id="fNombre" placeholder="Nombre completo" class="border rounded-lg p-2.5 text-sm"><input id="fTel" placeholder="Teléfono" class="border rounded-lg p-2.5 text-sm"><select id="fRol" onchange="toggleSaldos()" class="border rounded-lg p-2.5 text-sm"><option value="">Rol</option><option value="presidente">Presidente</option><option value="tesorero">Tesorero</option><option value="director">Director</option></select><select id="fComite" onchange="toggleSaldos()" class="border rounded-lg p-2.5 text-sm"><option value="">Comité</option><option value="Padres de Familia">Padres de Familia</option><option value="Parcela">Parcela</option><option value="Escuela es Nuestra">Escuela es Nuestra</option></select><div class="bg-emerald-50 border rounded-xl p-3"><input id="fSaldoCaja" type="number" placeholder="Saldo Caja Chica" class="w-full border rounded p-2 mt-2 text-sm"><div id="acreBox" class="hidden mt-2"><input id="fSaldoAcre" type="number" placeholder="Saldo Acreimex" class="w-full border rounded p-2 text-sm"></div></div><button onclick="crearUsuario()" class="bg-emerald-600 text-white rounded-xl py-3 font-bold text-sm">Dar de Alta</button><p id="adminMsg" class="text-xs"></p></div></div><div class="card"><h2 class="font-bold">Usuarios</h2><div id="listaUsuarios" class="mt-4 space-y-2 max-h-[700px] overflow-auto text-sm"></div><div id="editBox" class="hidden mt-6 border-t pt-4"><h3 class="font-bold text-sm">Modificar (sin password)</h3><input type="hidden" id="eId"><input id="eNombre" class="w-full border rounded p-2 mt-2 text-sm"><input id="eTel" class="w-full border rounded p-2 mt-2 text-sm"><select id="eRol" class="w-full border rounded p-2 mt-2 text-sm"><option value="presidente">Presidente</option><option value="tesorero">Tesorero</option><option value="director">Director</option></select><select id="eComite" class="w-full border rounded p-2 mt-2 text-sm"><option value="Padres de Familia">Padres de Familia</option><option value="Parcela">Parcela</option><option value="Escuela es Nuestra">Escuela es Nuestra</option></select><div class="flex gap-2 mt-3"><button onclick="guardarEdicion()" class="flex-1 bg-slate-900 text-white rounded py-2 text-sm">Guardar</button><button onclick="document.getElementById('editBox').classList.add('hidden')" class="flex-1 bg-slate-200 rounded py-2 text-sm">Cancelar</button></div></div></div></div></div>
<div id="tabBalance" class="hidden"><div id="misCuentas" class="grid md:grid-cols-2 gap-4"></div><div id="trasladoBox" class="card mt-6"><h2 class="font-bold">Traslado</h2><div class="grid md:grid-cols-4 gap-2 mt-3"><select id="tOrigen" class="border rounded p-2 text-sm"></select><select id="tDestino" class="border rounded p-2 text-sm"></select><input id="tMonto" type="number" placeholder="Monto" class="border rounded p-2 text-sm"><button onclick="iniciarTraslado()" class="bg-blue-600 text-white rounded p-2 text-sm">Transferir</button></div><div id="authBox" class="hidden mt-4 bg-yellow-50 border rounded-xl p-4"><div id="authCampos"></div><button onclick="confirmarTraslado()" class="w-full mt-3 bg-slate-900 text-white rounded py-2 text-sm">Autorizar</button></div></div></div>
<div id="tabAuditoria" class="hidden card"><h2 class="font-bold">Auditoría - Solo Director/SuperAdmin</h2><div class="grid md:grid-cols-4 gap-2 mt-4"><select id="audCuenta" class="border rounded p-2 text-sm"></select><input id="audFisico" type="number" placeholder="Saldo físico" class="border rounded p-2 text-sm"><input id="audObs" placeholder="Obs" class="border rounded p-2 text-sm"><button onclick="hacerAuditoria()" class="bg-purple-600 text-white rounded p-2 text-sm">Registrar</button></div><div id="listaAud" class="mt-6 text-xs"></div></div>
<div id="tabLogs" class="hidden card"><h2 class="font-bold">Logs</h2><div id="listaLogs" class="mt-3 text-xs"></div></div>
</main></div>
<script>
const SUPABASE_URL="https://bklzxolimbxyatlloanp.supabase.co";const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrbHp4b2xpbWJ4eWF0bGxvYW5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTg4MzksImV4cCI6MjEwNDc5NDgzOX0.qDb5llaNmbJINUt48bySfci8XBO4F3N-AqlGjKjq4V0";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null,trasladoTemp=null,resetLogin=null;
function passValida(p){return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(p);}
async function login(){
 const l=document.getElementById('lLogin').value.trim(),pa=document.getElementById('lPass').value.trim();
 document.getElementById('lDebug').textContent='Buscando '+l+'...';
 const {data,error}=await sb.from('usuarios').select('*').eq('login',l).eq('activo',true).single();
 if(error||!data){document.getElementById('lMsg').textContent='Usuario no existe o inactivo';document.getElementById('lDebug').textContent=error?error.message:'no data';return;}
 if(data.password!==pa){document.getElementById('lMsg').textContent='Contraseña incorrecta';return;}
 user=data;localStorage.setItem('ses',JSON.stringify(user));iniciar();
}
async function validarTelefono(){const l=document.getElementById('rLogin').value.trim(),t=document.getElementById('rTel').value.trim();const {data}=await sb.from('usuarios').select('*').eq('login',l).eq('telefono',t).single();if(!data){alert('No coincide');return;}document.getElementById('newPassBox').classList.remove('hidden');resetLogin=l;}
async function cambiarPass(){const np=document.getElementById('rNewPass').value;if(!passValida(np))return alert('Pass inválida');await sb.from('usuarios').update({password:np}).eq('login',resetLogin);alert('Cambiada');location.reload();}
function logout(){localStorage.removeItem('ses');location.reload();}
function buildMenu(){const m=document.getElementById('menu');let h='';if(['super_admin','director'].includes(user.rol))h+=`<button onclick="showTab('usuario')" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm">Usuario</button>`;if(['presidente','tesorero'].includes(user.rol))h+=`<button onclick="showTab('balance')" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-sm">Balance</button>`;if(['super_admin','director'].includes(user.rol))h+=`<button onclick="showTab('auditoria')" class="bg-purple-600 text-white px-4 py-2 rounded-xl text-sm">Auditoría</button>`;if(user.rol==='super_admin')h+=`<button onclick="showTab('logs')" class="bg-red-50 px-3 py-2 rounded-xl text-sm">Logs</button>`;h+=`<button onclick="logout()" class="bg-slate-200 px-3 py-2 rounded-xl text-sm">Salir</button>`;m.innerHTML=h;}
function showTab(t){['usuario','balance','auditoria','logs'].forEach(x=>{let el=document.getElementById('tab'+x.charAt(0).toUpperCase()+x.slice(1));if(el)el.classList.add('hidden');});document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.remove('hidden');if(t==='usuario')cargarAdmin();if(t==='balance')cargarMisCuentas();if(t==='auditoria')cargarAuditorias();}
function toggleSaldos(){const com=document.getElementById('fComite').value;const rol=document.getElementById('fRol').value;document.getElementById('acreBox').classList.toggle('hidden',!(com==='Padres de Familia' && rol==='tesorero'));}
async function iniciar(){if(!user)user=JSON.parse(localStorage.getItem('ses'));if(!user)return;document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('uNombre').textContent=user.nombre_completo;document.getElementById('uDetalle').textContent=`ID:${user.id} | ${user.login} | ${user.rol} | ${user.comite}`;buildMenu();if(['super_admin','director'].includes(user.rol))showTab('usuario');else showTab('balance');}
async function crearUsuario(){const login=document.getElementById('fLogin').value.trim(),pass=document.getElementById('fPass').value.trim(),nombre=document.getElementById('fNombre').value.trim(),tel=document.getElementById('fTel').value.trim(),rol=document.getElementById('fRol').value,comite=document.getElementById('fComite').value,sCaja=parseFloat(document.getElementById('fSaldoCaja').value)||0,sAcre=parseFloat(document.getElementById('fSaldoAcre').value);if(!login||!pass||!nombre||!tel||!rol||!comite)return alert('Faltan');if(!passValida(pass))return alert('Pass inválida');const mapa={'Padres de Familia':1,'Parcela':2,'Escuela es Nuestra':3};let comite_id=mapa[comite]||1;const maxId=await sb.from('usuarios').select('id').order('id',{ascending:false}).limit(1);let newId=(maxId.data?.[0]?.id||1)+1;const {data:u,error}=await sb.from('usuarios').insert([{id:newId,login,password:pass,nombre_completo:nombre,telefono:tel,rol,comite}]).select().single();if(error){document.getElementById('adminMsg').textContent=error.message;return;}await sb.from('cuentas').insert([{usuario_id:u.id,comite_id,tipo:'caja_chica',nombre:`Caja Chica ${comite} - ${nombre}`,saldo_inicial:sCaja}]);if(comite==='Padres de Familia'&&rol==='tesorero'&&!isNaN(sAcre)&&sAcre>0){await sb.from('cuentas').insert([{usuario_id:u.id,comite_id,tipo:'acreimex',nombre:`Acreimex ${comite} - ${nombre}`,saldo_inicial:sAcre}]);}document.getElementById('adminMsg').textContent='Creado ID '+u.id;cargarAdmin();}
async function cargarAdmin(){const {data}=await sb.from('usuarios').select('*').neq('id',1).order('id');document.getElementById('listaUsuarios').innerHTML=data.map(u=>`<div class="border rounded-xl p-3 bg-slate-50"><div class="flex justify-between"><div><b>ID:${u.id}</b> ${u.login}<br><span class="text-[11px]">${u.nombre_completo} | ${u.telefono} | ${u.rol} | ${u.comite} | ${u.activo?'Activo':'Baja'}</span></div><div class="flex flex-col gap-1"><button onclick="editar(${u.id})" class="text-xs bg-white border px-3 py-1 rounded">Modificar</button><button onclick="toggleActivo(${u.id},${u.activo})" class="text-xs bg-yellow-100 px-3 py-1 rounded">${u.activo?'Baja':'Alta'}</button><button onclick="borrarU(${u.id})" class="text-xs bg-red-100 px-3 py-1 rounded">Borrar</button></div></div></div>`).join('');}
function editar(id){sb.from('usuarios').select('*').eq('id',id).single().then(r=>{const u=r.data;document.getElementById('editBox').classList.remove('hidden');document.getElementById('eId').value=u.id;document.getElementById('eNombre').value=u.nombre_completo;document.getElementById('eTel').value=u.telefono;document.getElementById('eRol').value=u.rol;document.getElementById('eComite').value=u.comite;});}
async function guardarEdicion(){const id=parseInt(document.getElementById('eId').value),nombre=document.getElementById('eNombre').value.trim(),tel=document.getElementById('eTel').value.trim(),rol=document.getElementById('eRol').value,comite=document.getElementById('eComite').value;await sb.from('usuarios').update({nombre_completo:nombre,telefono:tel,rol,comite}).eq('id',id);document.getElementById('editBox').classList.add('hidden');cargarAdmin();}
async function toggleActivo(id,act){await sb.from('usuarios').update({activo:!act}).eq('id',id);cargarAdmin();}
async function borrarU(id){if(!confirm('¿Borrar?'))return;await sb.from('usuarios').delete().eq('id',id);cargarAdmin();}
async function cargarMisCuentas(){let q=sb.from('cuentas').select('*, usuarios(nombre_completo,rol), comites(nombre)').eq('usuario_id',user.id);const {data:cuentas}=await q.order('id');const cont=document.getElementById('misCuentas');cont.innerHTML='';const tO=document.getElementById('tOrigen'),tD=document.getElementById('tDestino');if(tO)tO.innerHTML='';if(tD)tD.innerHTML='';if(!cuentas||cuentas.length===0){cont.innerHTML='<div class="card text-sm">Sin cuentas</div>';return;}for(let c of cuentas){const {data:movs}=await sb.from('movimientos').select('*').eq('cuenta_id',c.id).order('fecha',{ascending:false});let ing=Number(c.saldo_inicial)||0,egr=0;movs.forEach(m=>{if(m.tipo==='entrada'||m.tipo==='traslado_recibido')ing+=Number(m.monto);else egr+=Number(m.monto);});const saldo=ing-egr;cont.innerHTML+=`<div class="card"><div class="flex justify-between"><div><h3 class="font-bold text-sm">${c.nombre}</h3><p class="text-[11px] text-slate-500">${c.comites?.nombre} | ${c.tipo} | Inicial $${c.saldo_inicial}</p></div><span class="font-bold">$${saldo.toFixed(2)}</span></div><div class="mt-3 bg-slate-50 border rounded-xl p-3"><input id="con_${c.id}" placeholder="Concepto" class="w-full border rounded p-2 mt-2 text-sm"><input id="mon_${c.id}" type="number" placeholder="Monto" class="w-full border rounded p-2 mt-2 text-sm"><select id="tip_${c.id}" class="w-full border rounded p-2 mt-2 text-sm"><option value="entrada">Entrada</option><option value="salida">Salida</option></select><input id="fec_${c.id}" type="date" class="w-full border rounded p-2 mt-2 text-sm"><input id="fil_${c.id}" type="file" accept="image/*" class="w-full text-xs mt-2"><button onclick="guardarMov(${c.id})" class="w-full mt-2 bg-slate-900 text-white rounded py-2 text-sm">Guardar</button></div><div class="mt-3 text-[11px] max-h-56 overflow-auto"><table class="w-full"><tbody>${movs.map(m=>`<tr class="border-t"><td>${m.fecha}</td><td>${m.tipo}</td><td>${m.concepto}</td><td>$${m.monto}</td><td><button onclick="pedirEliminar(${m.id})" class="text-red-500">x</button></td></tr>`).join('')}</tbody></table></div></div>`;if(tO)tO.innerHTML+=`<option value="${c.id}">${c.nombre} ($${saldo.toFixed(2)})</option>`;if(tD)tD.innerHTML+=`<option value="${c.id}">${c.nombre}</option>`;setTimeout(()=>{let e=document.getElementById('fec_${c.id}');if(e)e.valueAsDate=new Date();},30);}}
async function guardarMov(cid){const concepto=document.getElementById(`con_${cid}`).value.trim(),monto=parseFloat(document.getElementById(`mon_${cid}`).value),tipo=document.getElementById(`tip_${cid}`).value,fecha=document.getElementById(`fec_${cid}`).value,file=document.getElementById(`fil_${cid}`).files[0];if(!concepto||!monto)return alert('Falta');if(tipo==='salida'&&!file)return alert('Exige comprobante');let url=null;if(file){const name=Date.now()+'_'+file.name;try{await sb.storage.from('comprobantes').upload(name,file);const {data}=sb.storage.from('comprobantes').getPublicUrl(name);url=data.publicUrl;}catch(e){}}await sb.from('movimientos').insert([{cuenta_id:cid,usuario_id:user.id,tipo,concepto,monto,fecha,comprobante_url:url,created_by:user.id}]);cargarMisCuentas();}
async function iniciarTraslado(){const origen=parseInt(document.getElementById('tOrigen').value),destino=parseInt(document.getElementById('tDestino').value),monto=parseFloat(document.getElementById('tMonto').value);if(!monto||origen===destino)return alert('Error');const {data:cuOr}=await sb.from('cuentas').select('*, usuarios(*), comites(*)').eq('id',origen).single();const {data:cuDe}=await sb.from('cuentas').select('*, usuarios(*), comites(*)').eq('id',destino).single();const mismo=cuOr.comite_id===cuDe.comite_id;let html=`<label class="text-xs font-bold">Pass RECIBE</label><input id="authRec" type="password" class="w-full border rounded p-2 text-sm mb-2">`;if(!mismo)html+=`<label class="text-xs font-bold">Pass PRESIDENTE origen</label><input id="authPres" type="password" class="w-full border rounded p-2 text-sm mb-2">`;html+=`<label class="text-xs font-bold">Pass DIRECTOR</label><input id="authDir" type="password" class="w-full border rounded p-2 text-sm">`;document.getElementById('authCampos').innerHTML=html;document.getElementById('authBox').classList.remove('hidden');trasladoTemp={origen,destino,monto,cuOr,cuDe,mismo};}
async function confirmarTraslado(){const pr=document.getElementById('authRec').value,pd=document.getElementById('authDir').value,pp=document.getElementById('authPres')?.value;const {data:uRec}=await sb.from('usuarios').select('*').eq('id',trasladoTemp.cuDe.usuario_id).single();if(!uRec||uRec.password!==pr)return alert('Pass receptor mal');const {data:dirs}=await sb.from('usuarios').select('*').in('rol',['director','super_admin']).eq('activo',true);if(!dirs.some(d=>d.password===pd))return alert('Pass director mal');if(!trasladoTemp.mismo){const {data:pres}=await sb.from('usuarios').select('*').eq('comite',trasladoTemp.cuOr.comites.nombre).eq('rol','presidente').eq('activo',true);if(!pres?.some(p=>p.password===pp))return alert('Pass presidente mal');}const f=new Date().toISOString().split('T')[0];await sb.from('movimientos').insert([{cuenta_id:trasladoTemp.origen,usuario_id:user.id,tipo:'traslado_enviado',concepto:`Traslado a ${trasladoTemp.cuDe.usuarios.nombre_completo}`,monto:trasladoTemp.monto,fecha:f,created_by:user.id}]);await sb.from('movimientos').insert([{cuenta_id:trasladoTemp.destino,usuario_id:trasladoTemp.cuDe.usuario_id,tipo:'traslado_recibido',concepto:`Traslado de ${trasladoTemp.cuOr.usuarios.nombre_completo}`,monto:trasladoTemp.monto,fecha:f,created_by:user.id}]);alert('Traslado OK');document.getElementById('authBox').classList.add('hidden');cargarMisCuentas();}
async function pedirEliminar(mid){const p1=prompt('Pass autorizador 1');if(!p1)return;const p2=prompt('Pass DIRECTOR');if(!p2)return;const {data:all}=await sb.from('usuarios').select('*').eq('activo',true);if(!all.find(u=>u.password===p1))return alert('Aut1 mal');if(!all.some(u=>(u.rol==='director'||u.rol==='super_admin')&&u.password===p2))return alert('Director mal');await sb.from('movimientos').delete().eq('id',mid);alert('Eliminado');cargarMisCuentas();}
async function hacerAuditoria(){const cid=parseInt(document.getElementById('audCuenta').value),fis=parseFloat(document.getElementById('audFisico').value),obs=document.getElementById('audObs').value;if(isNaN(fis))return alert('Falta');const {data:cu}=await sb.from('cuentas').select('*').eq('id',cid).single();const {data:movs}=await sb.from('movimientos').select('*').eq('cuenta_id',cid);let ing=Number(cu.saldo_inicial)||0,egr=0;movs.forEach(m=>{if(m.tipo==='entrada'||m.tipo==='traslado_recibido')ing+=Number(m.monto);else egr+=Number(m.monto);});const sis=ing-egr,dif=fis-sis;const {data:prev}=await sb.from('auditorias').select('*').eq('cuenta_id',cid).order('fecha_auditoria',{ascending:false}).limit(1);if(prev&&prev.length>0){const dias=(new Date()-new Date(prev[0].fecha_auditoria))/(1000*60*60*24);const min=cu.tipo==='caja_chica'?40:50;if(dias<min)return alert(`Min ${min} días, van ${Math.floor(dias)}`);}await sb.from('auditorias').insert([{cuenta_id:cid,tipo:cu.tipo,saldo_fisico:fis,saldo_sistema:sis,diferencia:dif,observaciones:obs,auditor_id:user.id}]);alert('Arqueo dif $'+dif.toFixed(2));cargarAuditorias();}
async function cargarAuditorias(){const {data:cuentas}=await sb.from('cuentas').select('id,nombre,tipo').order('id');document.getElementById('audCuenta').innerHTML=cuentas.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('');const {data}=await sb.from('auditorias').select('*, cuentas(nombre)').order('fecha_auditoria',{ascending:false}).limit(100);document.getElementById('listaAud').innerHTML=(data||[]).map(a=>`<div class="border-b py-2">${a.fecha_auditoria} | ${a.cuentas?.nombre} | Dif $${a.diferencia}</div>`).join('')||'Sin';}
const ses=localStorage.getItem('ses');if(ses){user=JSON.parse(ses);iniciar();}
</script></body></html>
