<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Comités Escolares</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen text-gray-800">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">Sistema de Comités Escolares</h1>
                <p class="text-xs text-gray-300">REY BAUTISTA · Super Administrador</p>
            </div>
            <button onclick="cerrarSesion()" class="bg-red-600 hover:bg-red-700 text-white font-medium px-4 py-2 rounded text-sm transition">
                Cerrar sesión
            </button>
        </div>
    </header>

    <!-- PESTAÑAS -->
    <nav class="max-w-4xl mx-auto px-4 mt-6">
        <div class="flex space-x-2 border-b border-gray-300 pb-2">
            <button id="tab-inicio-btn" onclick="cambiarTab('inicio')" class="px-4 py-2 text-sm font-semibold rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300">
                Inicio
            </button>
            <button id="tab-usuarios-btn" onclick="cambiarTab('usuarios')" class="px-4 py-2 text-sm font-semibold rounded-md bg-slate-900 text-white">
                Usuarios
            </button>
            <button id="tab-comites-btn" onclick="cambiarTab('comites')" class="px-4 py-2 text-sm font-semibold rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300">
                Comités
            </button>
        </div>
    </nav>

    <!-- CONTENIDO -->
    <main class="max-w-4xl mx-auto px-4 py-6">

        <!-- INICIO -->
        <section id="sec-inicio" class="hidden">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Bienvenido al Sistema</h2>
                <p class="text-gray-600">Gestión centralizada de usuarios y comités escolares.</p>
            </div>
        </section>

        <!-- USUARIOS -->
        <section id="sec-usuarios" class="block">
            <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200 max-w-xl mx-auto">
                <h2 class="text-xl font-bold mb-4 text-slate-800">Usuarios</h2>

                <div id="alerta-contenedor" class="hidden mb-4"></div>

                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <h3 class="text-md font-semibold mb-4 text-slate-700">Nuevo usuario</h3>

                    <form id="form-crear-usuario" onsubmit="guardarUsuario(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre(s)</label>
                            <input type="text" id="nombre" required placeholder="GIOVANNY" oninput="this.value = this.value.toUpperCase()" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800 uppercase">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Apellidos</label>
                            <input type="text" id="apellidos" required placeholder="RAMOS" oninput="this.value = this.value.toUpperCase()" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800 uppercase">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Teléfono (WhatsApp)</label>
                            <input type="tel" id="telefono" required placeholder="9513025072" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Cargo / Rol</label>
                            <select id="cargo" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
                                <option value="Director">Director</option>
                                <option value="Presidente">Presidente</option>
                                <option value="Tesorero">Tesorero</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Comité asignado</label>
                            <select id="comite_id" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
                                <option value="">Sin comité</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Código o Nivel</label>
                            <input type="text" id="nivel" value="0" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800">
                        </div>

                        <div class="pt-2">
                            <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white font-medium px-6 py-2 rounded text-sm transition w-full sm:w-auto">
                                Crear usuario
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- COMITÉS -->
        <section id="sec-comites" class="hidden">
            <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200 max-w-xl mx-auto">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-slate-800">Gestión de Comités</h2>
                    <button onclick="insertarComitesBase()" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-semibold px-3 py-2 rounded transition">
                        + Registrar Comités Base
                    </button>
                </div>

                <div id="lista-comites-contenedor" class="space-y-2">
                    <p class="text-gray-500 text-sm italic">Cargando comités...</p>
                </div>
            </div>
        </section>

    </main>

    <script>
        // --- CREDENCIALES SUPABASE ---
        const SUPABASE_URL = "https://TU_PROYECTO_SUPABASE.supabase.co";
        const SUPABASE_KEY = "TU_KEY_PUBLICA_ANON_SUPABASE";
        
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function cambiarTab(tab) {
            ['inicio', 'usuarios', 'comites'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}-btn`).className = 'px-4 py-2 text-sm font-semibold rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300';
            });

            document.getElementById(`sec-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}-btn`).className = 'px-4 py-2 text-sm font-semibold rounded-md bg-slate-900 text-white';
        }

        async function cargarComites() {
            try {
                const { data: comites, error } = await db
                    .from('comites')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;

                const selectComite = document.getElementById('comite_id');
                const contenedorLista = document.getElementById('lista-comites-contenedor');

                selectComite.innerHTML = '<option value="">Sin comité</option>';
                contenedorLista.innerHTML = '';

                if (!comites || comites.length === 0) {
                    contenedorLista.innerHTML = '<p class="text-gray-500 text-sm italic">No hay comités registrados.</p>';
                    return;
                }

                comites.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.nombre;
                    selectComite.appendChild(opt);

                    const item = document.createElement('div');
                    item.className = 'p-3 bg-gray-50 rounded border border-gray-200 text-sm font-medium text-gray-800 flex justify-between items-center';
                    item.innerHTML = `<span>${c.nombre}</span> <span class="text-xs bg-slate-200 px-2 py-1 rounded text-slate-700">ID: ${c.id}</span>`;
                    contenedorLista.appendChild(item);
                });

            } catch (err) {
                console.error("Error al cargar comités:", err.message);
            }
        }

        async function insertarComitesBase() {
            const comitesBase = [
                { nombre: 'PADRES DE FAMILIA' },
                { nombre: 'PARCELA' },
                { nombre: 'ESCUELA ES NUESTRA' }
            ];

            const { error } = await db.from('comites').upsert(comitesBase, { onConflict: 'nombre' });
            
            if (error) {
                alert("Error al insertar comités: " + error.message);
            } else {
                alert("¡Comités creados correctamente!");
                cargarComites();
            }
        }

        async function guardarUsuario(event) {
            event.preventDefault();

            // Convertir explícitamente a MAYÚSCULAS
            const nombre = document.getElementById('nombre').value.trim().toUpperCase();
            const apellidos = document.getElementById('apellidos').value.trim().toUpperCase();
            const telefono = document.getElementById('telefono').value.trim();
            const cargo = document.getElementById('cargo').value;
            const comite_id = document.getElementById('comite_id').value || null;
            const nivel = document.getElementById('nivel').value;

            const tokenActivacion = "ACT-" + Math.floor(100000 + Math.random() * 900000);

            try {
                const { error } = await db.from('usuarios').insert([
                    {
                        nombre: nombre,
                        apellidos: apellidos,
                        telefono: telefono,
                        cargo: cargo,
                        comite_id: comite_id,
                        nivel: nivel,
                        token_activacion: tokenActivacion
                    }
                ]);

                if (error) throw error;

                // Formatear teléfono con lada de México (52) si falta
                let numLada = telefono.replace(/\D/g, '');
                if (numLada.length === 10) {
                    numLada = '52' + numLada;
                }

                // Generar mensaje directo para abrir WhatsApp
                const textoMensaje = encodeURIComponent(
                    `Usuario creado con éxito.\nEnlace de activación (WhatsApp):\nhttps://wa.me/${numLada}?text=Hola+${encodeURIComponent(nombre)}+tu+token+es+${tokenActivacion}`
                );

                const enlaceWhatsApp = `https://wa.me/${numLada}?text=${textoMensaje}`;

                const alertaContenedor = document.getElementById('alerta-contenedor');
                alertaContenedor.className = 'p-4 rounded-lg bg-green-100 border border-green-300 text-green-900 text-sm space-y-2';
                alertaContenedor.innerHTML = `
                    <p class="font-semibold text-emerald-800">Usuario creado con éxito.</p>
                    <p class="text-xs">Enlace de activación (WhatsApp):</p>
                    <a href="${enlaceWhatsApp}" target="_blank" class="inline-block bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2 rounded transition">
                        Enviar por WhatsApp
                    </a>
                `;
                alertaContenedor.classList.remove('hidden');

                document.getElementById('form-crear-usuario').reset();

            } catch (err) {
                const alertaContenedor = document.getElementById('alerta-contenedor');
                alertaContenedor.className = 'p-3 rounded-lg bg-red-100 border border-red-300 text-red-800 text-sm';
                alertaContenedor.textContent = "Error: " + err.message;
                alertaContenedor.classList.remove('hidden');
            }
        }

        function cerrarSesion() {
            alert("Sesión cerrada");
        }

        window.addEventListener('DOMContentLoaded', cargarComites);
    </script>
</body>
</html>
