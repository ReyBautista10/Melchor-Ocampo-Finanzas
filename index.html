<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Comités Escolares</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col font-sans">

  <!-- HEADER -->
  <header style="background-color: #1B365D;" class="text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold leading-tight">Sistema de Comités Escolares</h1>
        <p id="hdrUser" class="text-xs text-gray-300"></p>
      </div>
      <button id="btnLogout" onclick="logout()" class="hidden bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded transition">
        Cerrar sesión
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main id="app" class="flex-1 max-w-4xl w-full mx-auto p-4"></main>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE SUPABASE
    // ==========================================
    const SUPABASE_URL = "https://bklzxolimbxyatlloanp.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrbHp4b2xpbWJ4eWF0bGxvYW5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTg4MzksImV4cCI6MjEwNDc5NDgzOX0.qDb5llaNmbJINUt48bySfci8XBO4F3N-AqlGjKjq4V0";               
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ESTADO GLOBAL
    let state = {
      usuario: null,
      vista: 'inicio'
    };

    let comitesLista = [];

    // ==========================================
    // HELPERS UI
    // ==========================================
    function errBox(msg) {
      return `<div class="bg-red-100 border border-red-400 text-red-700 px-3 py-2 rounded text-xs mb-3">${msg}</div>`;
    }

    function okBox(msg) {
      return `<div class="bg-green-100 border border-green-400 text-green-700 px-3 py-2 rounded text-xs mb-3">${msg}</div>`;
    }

    // ==========================================
    // INICIALIZACIÓN
    // ==========================================
    window.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const tokenAct = params.get('token');

      if (tokenAct) {
        renderFormularioActivacion(tokenAct);
        return;
      }

      const userSesion = localStorage.getItem('usuario_sesion');
      if (userSesion) {
        state.usuario = JSON.parse(userSesion);
        actualizarHeader();
        await cargarComites();
        renderApp();
      } else {
        renderLogin();
      }
    });

    function actualizarHeader() {
      const hdrUser = document.getElementById("hdrUser");
      const btnLogout = document.getElementById("btnLogout");
      if (state.usuario) {
        hdrUser.textContent = `${state.usuario.nombre_completo} · ${state.usuario.rol}`;
        btnLogout.classList.remove("hidden");
      } else {
        hdrUser.textContent = "";
        btnLogout.classList.add("hidden");
      }
    }

    function logout() {
      localStorage.removeItem('usuario_sesion');
      state.usuario = null;
      actualizarHeader();
      renderLogin();
    }

    async function cargarComites() {
      const { data } = await sb.from("comites").select("*").order("nombre");
      if (data) comitesLista = data;
    }

    // ==========================================
    // LOGIN
    // ==========================================
    function renderLogin() {
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="max-w-sm mx-auto bg-white p-6 rounded-xl shadow-md border mt-10" style="border-color:#E1DED5">
          <h2 class="text-xl font-bold text-center mb-4" style="color:#1B365D">Iniciar Sesión</h2>
          <div id="loginMsg"></div>
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-semibold mb-1 text-gray-600">Usuario</label>
              <input id="lUsuario" type="text" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-1 focus:ring-blue-900" style="border-color:#E1DED5">
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1 text-gray-600">Contraseña</label>
              <input id="lPassword" type="password" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-1 focus:ring-blue-900" style="border-color:#E1DED5">
            </div>
            <button id="btnLoginAction" class="w-full py-2.5 rounded-lg text-white font-semibold text-sm transition shadow" style="background-color:#1B365D">
              Ingresar
            </button>
            <div class="text-center mt-3">
              <button onclick="renderSolicitudRecuperacion()" class="text-xs text-blue-900 hover:underline">
                ¿Olvidaste tu contraseña?
              </button>
            </div>
          </div>
        </div>
      `;

      document.getElementById("btnLoginAction").addEventListener("click", async () => {
        const msg = document.getElementById("loginMsg");
        msg.innerHTML = "";
        const u = document.getElementById("lUsuario").value.trim();
        const p = document.getElementById("lPassword").value;

        if (!u || !p) {
          msg.innerHTML = errBox("Ingresa usuario y contraseña.");
          return;
        }

        const { data, error } = await sb.rpc("usuario_login", { p_usuario: u, p_password: p });
        
        if (error) {
          msg.innerHTML = errBox("Error de autenticación: " + error.message);
          return;
        }

        if (!data || data.length === 0) {
          msg.innerHTML = errBox("Credenciales incorrectas o usuario inactivo.");
          return;
        }

        state.usuario = data[0];
        localStorage.setItem('usuario_sesion', JSON.stringify(state.usuario));
        actualizarHeader();
        await cargarComites();
        renderApp();
      });
    }

    // ==========================================
    // RECUPERACIÓN DE CONTRASEÑA
    // ==========================================
    function renderSolicitudRecuperacion() {
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="max-w-sm mx-auto bg-white p-6 rounded-xl shadow-md border mt-10" style="border-color:#E1DED5">
          <h2 class="text-xl font-bold text-center mb-2" style="color:#1B365D">Recuperar Contraseña</h2>
          <p class="text-xs text-gray-500 text-center mb-4">Ingresa tu usuario para gestionar la restauración.</p>
          <div id="recMsg"></div>
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-semibold mb-1 text-gray-600">Usuario</label>
              <input id="recUsuario" type="text" class="w-full px-3 py-2 border rounded-lg text-sm outline-none" style="border-color:#E1DED5">
            </div>
            <button id="btnSolicitarRec" class="w-full py-2.5 rounded-lg text-white font-semibold text-sm transition shadow" style="background-color:#1B365D">
              Enviar solicitud
            </button>
            <div class="text-center">
              <button onclick="renderLogin()" class="text-xs text-gray-600 hover:underline">
                Volver al inicio de sesión
              </button>
            </div>
          </div>
        </div>
      `;

      document.getElementById("btnSolicitarRec").addEventListener("click", async () => {
        const msg = document.getElementById("recMsg");
        msg.innerHTML = "";
        const u = document.getElementById("recUsuario").value.trim();

        if (!u) {
          msg.innerHTML = errBox("Ingresa tu nombre de usuario.");
          return;
        }

        if (u.toLowerCase() === 'reybautista10') {
          const { data, error } = await sb.rpc("recuperar_super_admin", { 
            p_usuario: u, 
            p_email: 'rdavid1229@hotmail.com' 
          });

          if (error) {
            msg.innerHTML = errBox(error.message);
            return;
          }

          msg.innerHTML = okBox(`Enlace generado. <a href="${data[0].link_activacion}" class="underline font-bold">Haz clic aquí para restablecer contraseña</a>`);
        } else {
          const { error } = await sb.rpc("solicitar_recuperacion", { p_usuario: u });
          if (error) {
            msg.innerHTML = errBox(error.message);
            return;
          }
          msg.innerHTML = okBox("Solicitud enviada. El administrador te enviará tu enlace por WhatsApp.");
        }
      });
    }

    // ==========================================
    // ACTIVACIÓN
    // ==========================================
    function renderFormularioActivacion(token) {
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="max-w-sm mx-auto bg-white p-6 rounded-xl shadow-md border mt-10" style="border-color:#E1DED5">
          <h2 class="text-xl font-bold text-center mb-2" style="color:#1B365D">Crear tu contraseña</h2>
          <p class="text-xs text-gray-500 text-center mb-4">Establece tu contraseña de acceso para continuar.</p>
          <div id="actMsg"></div>
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-semibold mb-1 text-gray-600">Nueva contraseña</label>
              <input id="actPass1" type="password" class="w-full px-3 py-2 border rounded-lg text-sm outline-none" style="border-color:#E1DED5">
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1 text-gray-600">Confirmar contraseña</label>
              <input id="actPass2" type="password" class="w-full px-3 py-2 border rounded-lg text-sm outline-none" style="border-color:#E1DED5">
            </div>
            <button id="btnGuardarPass" class="w-full py-2.5 rounded-lg text-white font-semibold text-sm transition shadow" style="background-color:#1B365D">
              Guardar contraseña
            </button>
          </div>
        </div>
      `;

      document.getElementById("btnGuardarPass").addEventListener("click", async () => {
        const msg = document.getElementById("actMsg");
        msg.innerHTML = "";
        const p1 = document.getElementById("actPass1").value;
        const p2 = document.getElementById("actPass2").value;

        if (!p1 || !p2) {
          msg.innerHTML = errBox("Llena ambos campos.");
          return;
        }

        if (p1 !== p2) {
          msg.innerHTML = errBox("Las contraseñas no coinciden.");
          return;
        }

        const { data, error } = await sb.rpc("activar_cuenta", { p_token: token, p_password: p1 });
        if (error) {
          msg.innerHTML = errBox(error.message);
          return;
        }

        msg.innerHTML = okBox("¡Contraseña guardada con éxito! Redirigiendo al inicio...");
        setTimeout(() => {
          window.location.href = window.location.pathname;
        }, 1500);
      });
    }

    // ==========================================
    // VISTAS DEL DASHBOARD
    // ==========================================
    function renderApp() {
      const app = document.getElementById("app");
      app.innerHTML = `
        <nav class="flex space-x-2 border-b pb-2 mb-4 overflow-x-auto text-sm font-semibold" style="border-color:#E1DED5">
          <button onclick="cambiarVista('inicio')" class="px-3 py-1.5 rounded-lg transition ${state.vista === 'inicio' ? 'bg-blue-900 text-white' : 'bg-gray-200 text-gray-700'}">Inicio</button>
          <button onclick="cambiarVista('usuarios')" class="px-3 py-1.5 rounded-lg transition ${state.vista === 'usuarios' ? 'bg-blue-900 text-white' : 'bg-gray-200 text-gray-700'}">Usuarios</button>
          <button onclick="cambiarVista('comites')" class="px-3 py-1.5 rounded-lg transition ${state.vista === 'comites' ? 'bg-blue-900 text-white' : 'bg-gray-200 text-gray-700'}">Comités</button>
        </nav>
        <div id="mainContent"></div>
      `;

      const main = document.getElementById("mainContent");
      if (state.vista === 'inicio') main.innerHTML = `<h3 class="text-lg font-bold" style="color:#1B365D">Bienvenido, ${state.usuario.nombre_completo}</h3>`;
      else if (state.vista === 'usuarios') renderUsuarios(main);
      else if (state.vista === 'comites') renderComites(main);
    }

    async function cambiarVista(v) {
      state.vista = v;
      if (v === 'usuarios' || v === 'comites') {
        await cargarComites();
      }
      renderApp();
    }

    function renderUsuarios(main) {
      let comiteOptions = `<option value="">Sin comité</option>`;
      comitesLista.forEach(c => {
        comiteOptions += `<option value="${c.id}">${c.nombre}</option>`;
      });

      main.innerHTML = `
        <h3 class="text-lg font-bold mb-3" style="color:#1B365D">Usuarios</h3>
        <div class="bg-white p-4 rounded-xl shadow-sm border mb-6" style="border-color:#E1DED5">
          <h4 class="text-sm font-bold mb-3" style="color:#1B365D">Nuevo usuario</h4>
          <div id="nuMsg"></div>
          <div class="grid grid-cols-2 gap-2 mb-2">
            <input id="nuUsuario" placeholder="Usuario (login)" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <input id="nuNombre" placeholder="Nombre completo" class="px-2 py-1.5 rounded-lg text-sm outline-none border uppercase" style="border-color:#E1DED5" />
          </div>
          <div class="grid grid-cols-2 gap-2 mb-2">
            <input id="nuTelefono" placeholder="Teléfono (WhatsApp)" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
            <select id="nuRol" onchange="actualizarCamposPorRol('nu')" class="px-2 py-1.5 rounded-lg text-sm outline-none border bg-white" style="border-color:#E1DED5">
              <option value="Director">Director</option>
              <option value="Presidente">Presidente</option>
              <option value="Tesorero">Tesorero</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-2 mb-3">
            <select id="nuComite" onchange="actualizarCamposPorRol('nu')" class="px-2 py-1.5 rounded-lg text-sm outline-none border bg-white" style="border-color:#E1DED5">
              ${comiteOptions}
            </select>
            <input id="nuSaldoCaja" type="number" placeholder="Saldo inicial caja chica" class="px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
          </div>
          <div id="nuAcreimexWrap" class="mb-3 hidden">
            <input id="nuSaldoAcreimex" type="number" placeholder="Saldo inicial cuenta Acreimex" class="w-full px-2 py-1.5 rounded-lg text-sm outline-none border" style="border-color:#E1DED5" />
          </div>
          <button id="nuGuardarBtn" class="px-4 py-2 rounded-lg text-white font-semibold text-sm transition shadow" style="background-color:#1B365D">
            Crear usuario
          </button>
        </div>
      `;

      actualizarCamposPorRol('nu');

      document.getElementById("nuNombre").addEventListener("input", (e) => {
        e.target.value = e.target.value
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toUpperCase()
          .replace(/[^A-Z0-9 ]/g, "");
      });

      document.getElementById("nuGuardarBtn").addEventListener("click", async () => {
        const msg = document.getElementById("nuMsg");
        msg.innerHTML = "";

        const usuario = document.getElementById("nuUsuario").value.trim();
        const nombre = document.getElementById("nuNombre").value.trim();
        const telefono = document.getElementById("nuTelefono").value.trim();
        const rol = document.getElementById("nuRol").value;
        const comiteId = document.getElementById("nuComite").value || null;

        if (!usuario || !nombre || !telefono) {
          msg.innerHTML = errBox("Completa los campos obligatorios.");
          return;
        }

        const { data, error } = await sb.rpc("usuario_crear", {
          p_usuario: usuario,
          p_nombre_completo: nombre,
          p_telefono: telefono,
          p_rol: rol,
          p_comite_id: comiteId
        });

        if (error) {
          msg.innerHTML = errBox(error.message);
          return;
        }

        const link = data[0].link_activacion;

        msg.innerHTML = okBox(`
          Usuario creado con éxito.<br>
          <b>Enlace de activación (WhatsApp):</b><br>
          <a href="${link}" target="_blank" class="underline font-mono text-xs break-all">${link}</a>
        `);
      });
    }

    function renderComites(main) {
      let comitesHtml = comitesLista.map(c => `
        <div class="bg-white p-3 rounded-lg border mb-2" style="border-color:#E1DED5">
          <p class="font-bold text-sm" style="color:#1B365D">${c.nombre}</p>
        </div>
      `).join('');

      main.innerHTML = `
        <h3 class="text-lg font-bold mb-3" style="color:#1B365D">Gestión de Comités</h3>
        ${comitesHtml || '<p class="text-xs text-gray-500">No hay comités registrados.</p>'}
      `;
    }

    function actualizarCamposPorRol(prefijo) {
      const rol = document.getElementById(`${prefijo}Rol`).value;
      const comiteSel = document.getElementById(`${prefijo}Comite`);
      const saldoCajaInput = document.getElementById(`${prefijo}SaldoCaja`);
      const comiteId = comiteSel.value;
      const comite = comitesLista.find(c => c.id === comiteId);
      const wrapAcreimex = document.getElementById(`${prefijo}AcreimexWrap`);

      const esAdministrativo = (rol === "Director" || rol === "Super Administrador");

      if (esAdministrativo) {
        comiteSel.value = "";
        comiteSel.disabled = true;
        if (saldoCajaInput) {
          saldoCajaInput.value = "0";
          saldoCajaInput.disabled = true;
        }
      } else {
        comiteSel.disabled = false;
        if (saldoCajaInput) {
          saldoCajaInput.disabled = false;
        }
      }

      const esTesoreroPadres = (rol === "Tesorero") && comite && (comite.nombre === "PADRES DE FAMILIA");

      if (wrapAcreimex) {
        wrapAcreimex.style.display = esTesoreroPadres ? "block" : "none";
      }
    }
  </script>
</body>
</html>
