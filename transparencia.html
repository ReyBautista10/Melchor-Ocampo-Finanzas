<!DOCTYPE html>

<head>

</div>
<div id="app" class="p-5 max-w-md mx-auto"></div>

<script>
const SUPABASE_URL = "https://bklzxolimbxyatlloanp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrbHp4b2xpbWJ4eWF0bGxvYW5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTg4MzksImV4cCI6MjEwNDc5NDgzOX0.qDb5llaNmbJINUt48bySfci8XBO4F3N-AqlGjKjq4V0";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const COLOR = "#1C3D5A";
const app = document.getElementById("app");
const state = { cargos: [], sel: null, ultimo: null };

function errBox(t) { return `<div class="text-xs mb-3 p-2 rounded-lg" style="background:#F5E4E1; color:#B5453A">${t}</div>`; }
function dinero(n) { return "$" + Number(n).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function etiquetaCargo(c) { return `${c.rol} de ${c.comite_nombre}`.toUpperCase(); }

// ============================================================
// Helpers compartidos de periodo (Completo / Mensual / Personalizado)
// ============================================================
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

function periodoControlesHTML(id, etiquetaCompleto, est) {
  est = est || {};
  const hoy = new Date();
  const modo = est.modo || "completo";
  const mes = est.mes !== undefined ? est.mes : hoy.getMonth();
  const anio = est.anio !== undefined ? est.anio : hoy.getFullYear();
  const estilo = 'border-color:#E1DED5';
  const anios = [];
  for (let a = hoy.getFullYear(); a >= hoy.getFullYear() - 4; a--) anios.push(a);
  return `
    <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Periodo</label>
    <select id="${id}Modo" class="w-full px-3 py-2 rounded-lg text-sm mb-2 outline-none border" style="${estilo}">
      <option value="completo" ${modo === "completo" ? "selected" : ""}>${etiquetaCompleto}</option>
      <option value="mensual" ${modo === "mensual" ? "selected" : ""}>Mensual</option>
      <option value="personalizado" ${modo === "personalizado" ? "selected" : ""}>Periodo personalizado</option>
    </select>
    <div id="${id}MesWrap" style="display:${modo === "mensual" ? "grid" : "none"}" class="grid grid-cols-2 gap-2 mb-2">
      <select id="${id}Mes" class="px-2 py-2 rounded-lg text-sm outline-none border" style="${estilo}">
        ${MESES.map((m, i) => `<option value="${i}" ${i === mes ? "selected" : ""}>${m}</option>`).join("")}
      </select>
      <select id="${id}Anio" class="px-2 py-2 rounded-lg text-sm outline-none border" style="${estilo}">
        ${anios.map(a => `<option value="${a}" ${a === anio ? "selected" : ""}>${a}</option>`).join("")}
      </select>
    </div>
    <div id="${id}RangoWrap" style="display:${modo === "personalizado" ? "grid" : "none"}" class="grid grid-cols-2 gap-2 mb-2">
      <div>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Desde</label>
        <input id="${id}Desde" type="date" value="${est.desde || ""}" class="w-full px-2 py-1.5 rounded-lg text-sm outline-none border" style="${estilo}" />
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Hasta</label>
        <input id="${id}Hasta" type="date" value="${est.hasta || ""}" class="w-full px-2 py-1.5 rounded-lg text-sm outline-none border" style="${estilo}" />
      </div>
    </div>`;
}

function periodoEnlazar(id) {
  document.getElementById(id + "Modo").addEventListener("change", (e) => {
    document.getElementById(id + "MesWrap").style.display = e.target.value === "mensual" ? "grid" : "none";
    document.getElementById(id + "RangoWrap").style.display = e.target.value === "personalizado" ? "grid" : "none";
  });
}

function periodoLeer(id) {
  const modo = document.getElementById(id + "Modo").value;
  const mes = Number(document.getElementById(id + "Mes").value);
  const anio = Number(document.getElementById(id + "Anio").value);
  const desde = document.getElementById(id + "Desde").value;
  const hasta = document.getElementById(id + "Hasta").value;
  const base = { modo, mes, anio, desde, hasta };
  if (modo === "completo") {
    const fin = new Date(); fin.setHours(23, 59, 59, 999);
    return { ...base, fechaInicio: new Date(2000, 0, 1), fechaFin: fin, texto: "Completo" };
  }
  if (modo === "mensual") {
    return { ...base, fechaInicio: new Date(anio, mes, 1, 0, 0, 0), fechaFin: new Date(anio, mes + 1, 0, 23, 59, 59), texto: `${MESES[mes]} ${anio}` };
  }
  if (!desde || !hasta) return { ...base, error: "Selecciona las dos fechas del rango." };
  const fi = new Date(desde + "T00:00:00"), ff = new Date(hasta + "T23:59:59");
  if (fi > ff) return { ...base, error: "La fecha de inicio no puede ser posterior a la fecha final." };
  return { ...base, fechaInicio: fi, fechaFin: ff, texto: "Personalizado" };
}

// hist = movimientos de la cuenta en orden ascendente (es_entrada, monto, creado_en)
function construirEstadoCuenta(hist, saldoActual, rango) {
  const neto = hist.filter(h => new Date(h.creado_en) >= rango.fechaInicio)
    .reduce((s, h) => s + (h.es_entrada ? Number(h.monto) : -Number(h.monto)), 0);
  const balanceInicial = Number(saldoActual) - neto;
  let corrido = balanceInicial;
  const filas = hist.filter(h => { const f = new Date(h.creado_en); return f >= rango.fechaInicio && f <= rango.fechaFin; })
    .map(f => { corrido += f.es_entrada ? Number(f.monto) : -Number(f.monto); return { ...f, balance: corrido }; });
  const ini = rango.modo === "completo" ? (hist.length ? new Date(hist[0].creado_en) : new Date()) : rango.fechaInicio;
  const fin = rango.modo === "completo" ? new Date() : rango.fechaFin;
  return {
    balanceInicial, filas,
    fechaInicioTexto: ini.toLocaleDateString("es-MX"),
    fechaFinTexto: fin.toLocaleDateString("es-MX"),
  };
}

// ============================================================
// Genera el PDF del reporte (estado de cuenta) con autoTable
// ============================================================
function generarReporteEstadoCuentaPDF({ titular, cargo, cuenta, fechaInicioTexto, fechaFinTexto, balanceInicial, filas, directorNombre }) {
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "letter", orientation: "portrait" });

  const body = filas.map((f, i) => [
    String(i + 1),
    new Date(f.creado_en).toLocaleString("es-MX", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }),
    f.concepto || "",
    f.tipo,
    f.es_entrada ? `$${Number(f.monto).toFixed(2)}` : "",
    !f.es_entrada ? `$${Number(f.monto).toFixed(2)}` : "",
    `$${Number(f.balance).toFixed(2)}`,
  ]);

  doc.autoTable({
    startY: 45,
    head: [["No.", "Fecha y hora", "Concepto", "Tipo", "Entradas", "Salidas", "Balance"]],
    body,
    styles: { fontSize: 7, cellPadding: 1.5, valign: "middle" },
    headStyles: { fillColor: [28, 61, 90] },
    columnStyles: {
      0: { cellWidth: 8 },
      1: { cellWidth: 26 },
      2: { cellWidth: 56 },
      3: { cellWidth: 24 },
      4: { cellWidth: 22, halign: "right" },
      5: { cellWidth: 22, halign: "right" },
      6: { cellWidth: 24, halign: "right" },
    },
    margin: { top: 45, bottom: 25, left: 12, right: 12 },
    didDrawPage: (data) => {
      if (data.pageNumber === 1) {
        doc.setFontSize(13);
        doc.setFont(undefined, "bold");
        doc.text("Estado de Cuenta — Sistema de Comités Escolares", 12, 15);
        doc.setFont(undefined, "normal");
        doc.setFontSize(9);
        doc.text(`Titular: ${titular}`, 12, 21);
        doc.text(`Cargo: ${String(cargo).toUpperCase()}`, 12, 26);
        doc.text(`Cuenta: ${cuenta}`, 12, 31);
        doc.text(`Periodo: ${fechaInicioTexto} a ${fechaFinTexto}`, 12, 36);
        doc.text(`Balance inicial: $${Number(balanceInicial).toFixed(2)}`, 12, 41);
      }
    },
  });

  // Decide en qué página van las firmas (si no cabe, se agrega una hoja nueva)
  let paginaFirmas = doc.internal.getNumberOfPages();
  doc.setPage(paginaFirmas);
  let yFirma = (doc.lastAutoTable ? doc.lastAutoTable.finalY : 50) + 25;
  const alturaUtil = doc.internal.pageSize.getHeight() - 25;
  if (yFirma + 15 > alturaUtil) {
    doc.addPage();
    paginaFirmas = doc.internal.getNumberOfPages();
    yFirma = 35;
  }

  // Firmas (solo en la página final)
  doc.setPage(paginaFirmas);
  doc.setFontSize(9);
  doc.setFont(undefined, "normal");
  doc.text("Elaboró:", 12, yFirma - 10);
  doc.line(12, yFirma, 90, yFirma);
  doc.text(String(titular).toUpperCase(), 12, yFirma + 5);
  doc.text(String(cargo).toUpperCase(), 12, yFirma + 10);

  doc.text("Autorizó:", 125, yFirma - 10);
  doc.line(125, yFirma, 198, yFirma);
  doc.text(String(directorNombre || "—").toUpperCase(), 125, yFirma + 5);
  doc.text('DIRECTOR DE LA ESCUELA PRIMARIA "MELCHOR OCAMPO"', 125, yFirma + 10);

  // Numeración X/Y en todas las páginas (se hace al final, ya con el total correcto)
  const totalPaginas = doc.internal.getNumberOfPages();
  for (let p = 1; p <= totalPaginas; p++) {
    doc.setPage(p);
    doc.setFontSize(8);
    doc.text(`${p}/${totalPaginas}`, doc.internal.pageSize.getWidth() - 20, doc.internal.pageSize.getHeight() - 10);
  }

  doc.save(`estado_cuenta_${cuenta.toLowerCase().replace(" ", "_")}_${new Date().toISOString().slice(0, 10)}.pdf`);
}


async function pantallaLista() {
  state.sel = null;
  app.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Cargando…</p>`;
  const { data, error } = await sb.rpc("publico_cargos_listar");
  if (error) { app.innerHTML = errBox(error.message); return; }
  state.cargos = data || [];
  app.innerHTML = `
    <p class="text-sm mb-1 font-semibold" style="color:${COLOR}">Consulta el estado de cuenta</p>
    <p class="text-xs mb-4" style="color:#6C7B8A">Selecciona el cargo del que deseas conocer el manejo de los recursos.</p>
    <div class="space-y-2">
      ${state.cargos.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Aún no hay cargos registrados.</p>` : state.cargos.map((c, i) => `
        <button class="cargoBtn w-full text-left px-4 py-3 rounded-xl bg-white border text-sm font-semibold" data-i="${i}" style="border-color:#E1DED5; color:${COLOR}">${etiquetaCargo(c)}</button>`).join("")}
    </div>`;
  app.querySelectorAll(".cargoBtn").forEach(b => b.addEventListener("click", () => pantallaConsulta(state.cargos[Number(b.dataset.i)])));
}

function pantallaConsulta(c) {
  state.sel = c;
  app.innerHTML = `
    <button id="volver" class="text-xs underline mb-3" style="color:${COLOR}">← Volver al listado</button>
    <p class="text-sm font-semibold mb-3" style="color:${COLOR}">${etiquetaCargo(c)}</p>
    <div class="p-4 rounded-xl bg-white border" style="border-color:#E1DED5">
      ${c.tiene_acreimex ? `
      <label class="block text-xs font-semibold mb-1" style="color:#6C7B8A">Cuenta</label>
      <select id="pubCuenta" class="w-full px-3 py-2 rounded-lg text-sm mb-3 outline-none border" style="border-color:#E1DED5">
        <option value="Caja chica">Caja chica</option>
        <option value="Acreimex">Acreimex</option>
      </select>` : ""}
      ${periodoControlesHTML("pub", "Completo (desde el primer movimiento)", { modo: "completo" })}
      <div id="pubMsg" class="mt-2"></div>
      <button id="pubVer" class="w-full mt-2 py-2 rounded-lg text-sm font-bold text-white" style="background:${COLOR}">Ver estado de cuenta</button>
    </div>
    <div id="pubResultado" class="mt-4"></div>`;
  document.getElementById("volver").addEventListener("click", pantallaLista);
  periodoEnlazar("pub");
  document.getElementById("pubVer").addEventListener("click", consultar);
}

async function consultar() {
  const c = state.sel;
  const msg = document.getElementById("pubMsg");
  const res = document.getElementById("pubResultado");
  msg.innerHTML = ""; res.innerHTML = "";
  const cuenta = c.tiene_acreimex ? document.getElementById("pubCuenta").value : "Caja chica";
  const rango = periodoLeer("pub");
  if (rango.error) { msg.innerHTML = errBox(rango.error); return; }
  msg.innerHTML = `<p class="text-xs" style="color:#6C7B8A">Consultando…</p>`;

  const [{ data: info, error: e1 }, { data: hist, error: e2 }] = await Promise.all([
    sb.rpc("publico_cuenta_info", { p_usuario_id: c.usuario_id, p_cuenta: cuenta }),
    sb.rpc("publico_estado_cuenta", { p_usuario_id: c.usuario_id, p_cuenta: cuenta }),
  ]);
  if (e1 || e2) { msg.innerHTML = errBox((e1 || e2).message); return; }
  msg.innerHTML = "";
  const datos = info && info[0];
  if (!datos) { msg.innerHTML = errBox("No se encontró la cuenta."); return; }

  const est = construirEstadoCuenta(hist || [], datos.saldo_actual, rango);
  const totEnt = est.filas.filter(f => f.es_entrada).reduce((s, f) => s + Number(f.monto), 0);
  const totSal = est.filas.filter(f => !f.es_entrada).reduce((s, f) => s + Number(f.monto), 0);
  const balanceFinal = est.balanceInicial + totEnt - totSal;

  res.innerHTML = `
    <div class="p-4 rounded-xl bg-white border" style="border-color:#E1DED5">
      <p class="text-xs" style="color:#6C7B8A">${datos.titular} · ${cuenta}</p>
      <p class="text-xs mb-2" style="color:#6C7B8A">Del ${est.fechaInicioTexto} al ${est.fechaFinTexto}</p>
      <div class="grid grid-cols-2 gap-2 mb-3 text-xs" style="color:#1C2B3A">
        <div>Balance inicial<br><b>${dinero(est.balanceInicial)}</b></div>
        <div>Balance final<br><b>${dinero(balanceFinal)}</b></div>
        <div>Entradas<br><b style="color:#3F7A5E">${dinero(totEnt)}</b></div>
        <div>Salidas<br><b style="color:#B5453A">${dinero(totSal)}</b></div>
      </div>
      <button id="pubPdf" class="mb-3 px-3 py-1.5 rounded-lg text-xs font-bold text-white" style="background:${COLOR}">📄 Descargar PDF</button>
      <div class="space-y-2">
        ${est.filas.length === 0 ? `<p class="text-sm" style="color:#6C7B8A">Sin movimientos en este periodo.</p>` : est.filas.map(f => `
          <div class="p-2 rounded-lg border" style="border-color:#E1DED5">
            <div class="flex justify-between text-xs">
              <span style="color:#6C7B8A">${new Date(f.creado_en).toLocaleString("es-MX", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })}</span>
              <b style="color:${f.es_entrada ? "#3F7A5E" : "#B5453A"}">${f.es_entrada ? "+" : "−"} ${dinero(f.monto)}</b>
            </div>
            <p class="text-xs" style="color:#1C2B3A">${f.tipo} — ${f.concepto || ""}</p>
            <p class="text-xs" style="color:#6C7B8A">Balance: ${dinero(f.balance)}</p>
          </div>`).join("")}
      </div>
    </div>`;

  document.getElementById("pubPdf").addEventListener("click", () => {
    generarReporteEstadoCuentaPDF({
      titular: datos.titular, cargo: etiquetaCargo(c), cuenta,
      fechaInicioTexto: est.fechaInicioTexto, fechaFinTexto: est.fechaFinTexto,
      balanceInicial: est.balanceInicial, filas: est.filas, directorNombre: datos.director_nombre || "—",
    });
  });
}

pantallaLista();
</script>
</body>
